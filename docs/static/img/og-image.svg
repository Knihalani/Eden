<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <rect width="80" height="80" rx="14" fill="#0a0a0a" stroke="#3b82f6" stroke-width="2"/>
    <text x="40" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="56" font-weight="700" fill="#3b82f6" text-anchor="middle">E</text>
  </g>

  <!-- Brand -->
  <text x="190" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="42" font-weight="700" fill="#f3f4f6" letter-spacing="-0.02em">Eden</text>
  <text x="190" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#9ca3af" letter-spacing="0.05em">DOCS · v1.7</text>

  <!-- Headline -->
  <text x="80" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" font-weight="700" fill="#f3f4f6" letter-spacing="-0.02em">The intelligence layer</text>
  <text x="80" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" font-weight="700" fill="#3b82f6" letter-spacing="-0.02em">for AI agents.</text>

  <!-- Subtitle -->
  <text x="80" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#9ca3af">Observability · Evaluation · Governance · Self-healing</text>

  <!-- Bottom rail -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#1f1f1f" stroke-width="1"/>
  <text x="80" y="580" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6b7280">docs.edenobservability.com</text>
  <text x="1120" y="580" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6b7280" text-anchor="end">$ eden init</text>
</svg>
