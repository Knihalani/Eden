[project]
name = "eden"
version = "0.1.0"
description = "Eden — AI-native agent evaluation and observability platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Eden Team" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # LLM API (OpenRouter)
    "openrouter>=0.3.0,<1.0.0",
    "openai>=1.0.0,<2.0.0",
    # Anthropic SDK — used by the AI Insights chat sidebar (B4).
    # OpenRouter above still drives the main pipeline.
    "anthropic>=0.40.0,<1.0.0",

    # Database
    "psycopg2-binary>=2.9.9,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "pgbouncer>=0.0.0",  # not a Python package, noted for infra
    # Redis — used by IdempotencyMiddleware, TenantRateLimitMiddleware,
    # OptimizationCache, and the RedisTailer judge pipeline. Was an
    # undeclared dep that broke test collection through the
    # `eden.api.middleware → eden.storage.redis` import chain.
    "redis>=5.0.0,<6.0.0",

    # Vector search
    "qdrant-client>=1.9.0,<2.0.0",

    # API
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sse-starlette>=2.0.0,<3.0.0",

    # Auth
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.0,<2.0.0",
    "pyotp>=2.9.0,<3.0.0",
    "qrcode>=7.4.0,<8.0.0",

    # Code quality
    "pylint>=3.0.0,<4.0.0",
    "flake8>=7.0.0,<8.0.0",
    "mypy>=1.11.0,<2.0.0",
    "bandit>=1.7.0,<2.0.0",
    "semgrep>=1.80.0,<2.0.0",
    "radon>=6.0.0,<7.0.0",
    "safety>=3.0.0,<4.0.0",

    # Testing
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",

    # ClickHouse HTTP interface — used by data_platform.clickhouse_sink
    # and the columnar engine (Cat 18). Was an undeclared dep that
    # would crash any code path hitting `ClickHouseSink._get_session`.
    # See docs/architecture/clickhouse-transport.md for why we keep
    # raw aiohttp over `clickhouse-connect`.
    "aiohttp>=3.9.0,<4.0.0",

    # GitHub App auth + REST — used by the onboarding wizard
    # (GitHubRepoProvider, GitHubPRProvider) and the integration PR flow.
    "PyGithub>=2.3.0,<3.0.0",

    # Utilities
    "tenacity>=8.3.0,<9.0.0",
    "structlog>=24.0.0,<25.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "httpx[socks]>=0.27.0,<1.0.0",  # for web research
    "beautifulsoup4>=4.12.0,<5.0.0",  # for web scraping
    "lxml>=5.0.0,<6.0.0",

    # Compression (Phase 3 of the Postgres + Compression plan)
    # zstandard: 4.76x avg compression on LLM prompt/response payloads (LoPace 2026).
    # Stored as BYTEA on telemetry_events (request_body_zstd, response_body_zstd).
    "zstandard>=0.23.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.8.0,<4.0.0",
    "ruff>=0.6.0,<1.0.0",
    "debugpy>=1.8.0,<2.0.0",
    "ipdb>=0.13.0,<1.0.0",
]

# Phase 2: the env-gen pipeline (and its `eden` console script entry
# point, which used to launch the legacy thin CLI) has been retired.
# The server is launched via ``uvicorn eden.api.app:app`` (see
# the Dockerfiles). The Eden Agent CLI was deleted entirely in the
# June 2026 backlog cleanup — onboarding now happens through the
# portal wizard + SDK; FrameworkDetector + SDKIntegrator moved to
# src/eden/integrations/.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eden"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.bandit]
targets = ["src/"]
skips = ["B413"]  # blacklist (e.g. crypto) - needed for some valid use cases

# Phase 2: the env-gen LangGraph pipeline is retired; the [tool.langgraph]
# sections above (langchain-core deps, postgres checkpoint config) are gone.