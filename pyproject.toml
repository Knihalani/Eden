[project]
name = "eden"
version = "0.1.0"
description = "Eden — AI-native agent evaluation and observability platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Eden Team" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # LLM APIs — Eden talks to OpenRouter / MiniMax via the
    # OpenAI-compatible interface (no PyPI `openrouter` package — we
    # use a custom httpx wrapper at eden.llm.client). Anthropic is
    # used by the AI Insights chat sidebar (B4).
    "openai>=1.0.0,<2.0.0",
    # Anthropic SDK — used by the AI Insights chat sidebar (B4).
    # OpenRouter above still drives the main pipeline.
    "anthropic>=0.109.1,<1.0.0",
    # JWT — replaces python-jose[cryptography]. Drops the `ecdsa`
    # transitive that was carrying CVE-2024-23342 / PVE-2024-64396.
    # `pyjwt[crypto]` pins cryptography ≥ 42 which closes
    # GHSA-537c-gmf6-5ccf (OpenSSL) at the same time.
    # Explicit cryptography pin: CVE-2026-69247 fixed in 50.0.0+.
    "pyjwt[crypto]>=2.13.0,<3.0.0",
    "cryptography>=50.0.0",
    # Database
    "psycopg2-binary>=2.9.9,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    # Redis — used by IdempotencyMiddleware, TenantRateLimitMiddleware,
    # OptimizationCache, and the RedisTailer judge pipeline. Was an
    # undeclared dep that broke test collection through the
    # `eden.api.middleware → eden.storage.redis` import chain.
    "redis>=5.0.0,<6.0.0",
    # Vector search is pgvector (N4) — no separate client dependency.
    # API
    "fastapi>=0.115.0,<0.137.0",  # pin below 0.137: PR #15745 made include_router() lazy
    # (app.routes holds opaque _IncludedRouter wrappers w/o .path), breaking route-count
    # snapshots and router-inclusion checks across the test suite.
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "email-validator>=2.0.0,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",  # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2
    "sse-starlette>=3.4.5,<4.0.0",
    # CVE-2026-53538/9/40 fixed in 0.0.30+. Latest is 0.0.32.
    "python-multipart>=0.0.32,<1.0.0",
    # Auth — TOTP / QR for the 2FA flow.
    # `python-jose`, `passlib[bcrypt]`, `python-dotenv`, and
    # `openrouter` (PyPI) were dropped in the 2026-07-07 dep audit:
    # - python-jose → replaced by pyjwt (above)
    # - passlib[bcrypt] → `passlib` is moved to [dev]; eden calls
    #   `bcrypt.hashpw`/`checkpw` directly.
    # - python-dotenv → pydantic-settings reads .env natively.
    # - openrouter → unused (Eden talks HTTP via httpx).
    "pyotp>=2.9.0,<3.0.0",
    "qrcode>=7.4.0,<8.0.0",
    "bcrypt>=5.0.0,<6.0.0",
    # ClickHouse HTTP interface — used by data_platform.clickhouse_sink
    # and the columnar engine. See docs/architecture/clickhouse-transport.md
    # for why we keep raw aiohttp over `clickhouse-connect`.
    # CVE-2026-59881 / CVE-2026-69243 / CVE-2026-69244 fixed in 3.14.3+.
    "aiohttp>=3.14.3,<4.0.0",
    # S3-compatible storage (Impossible Cloud, AWS S3) — used by
    # `eden.data_platform.storage_lifecycle` and
    # `scripts/migrate_s3_to_impossible_cloud.py`. Was previously an
    # undeclared transitive of `semgrep`.
    "boto3>=1.35.0,<2.0.0",
    # Prometheus metrics — used by the quality pipeline worker.
    # Was previously an undeclared transitive of `safety`.
    "prometheus-client>=0.21.0,<1.0.0",
    # Stripe billing — used by eden.api.routes.billing (5 routes,
    # all lazy). Was previously an undeclared transitive of
    # `semgrep` → `pyjwt[crypto]`.
    "stripe>=11.0.0,<12.0.0",
    # YAML config files — used by eden.integrations.sdk_integrator
    # and eden.api.routes.agent_runs. Was previously an undeclared
    # transitive of `bandit` → `PyYAML`.
    "PyYAML>=6.0.0,<7.0.0",
    # Date parsing — used by eden.realtime.trace_store. Was
    # previously an undeclared transitive of `botocore`.
    "python-dateutil>=2.9.0,<3.0.0",
    # HTTP client. Replaces the legacy `openrouter` PyPI package
    # and the [socks] extra (Eden does not route through SOCKS).
    "httpx>=0.27.0,<1.0.0",
    # Transactional + sparse alert email (SendKit).
    "sendkit>=1.0.7,<2.0.0",
    # Fast JSON for hot paths (Postgres JSONB, Redis cache, SSE).
    # Consumed via ``eden.util.jsonx``; stdlib json remains the fallback.
    "orjson>=3.10.0,<4.0.0",
    # CLI transitive (uvicorn/typer) — pinned for PYSEC-2026-2132 (click 8.1.x).
    "click>=8.3.3,<9.0.0",
    # Logging
    "structlog>=24.0.0,<25.0.0",
    # Compression (Phase 3 of the Postgres + Compression plan)
    # zstandard: 4.76x avg compression on LLM prompt/response
    # payloads (LoPace 2026). Stored as BYTEA on telemetry_events
    # (request_body_zstd, response_body_zstd).
    "zstandard>=0.23.0,<1.0.0",
    # Migrations — the runtime API never imports `alembic` directly,
    # but the test-suite's CI workflow shells out to `alembic upgrade
    # head` against the eden_test DB, and the Dockerfile entrypoint
    # script invokes `alembic` at container start.
    "alembic>=1.13.0,<2.0.0",
    # Error tracking — initialized when SENTRY_DSN is set (Northflank).
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.0,<5.0.0",
    "ruff>=0.6.0,<1.0.0",
    # Pinned via uv.lock so CI's `uv run mypy src/` type-checks against
    # a reproducible version instead of whatever is latest that day.
    "mypy>=1.14,<2.2",
    # Test framework + plugins. Moved out of [project].dependencies
    # because nothing in src/eden/ imports them — they're strictly
    # test-only.
    "pytest>=9.1.1,<10.0.0",  # CVE-2025-71176 fixed in 9.0.3
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    # passlib 1.7.4 + bcrypt 5.x incompatibility shim — see
    # tests/conftest.py for the exact monkey-patches.
    "passlib>=1.7.4,<2.0.0",
    # Security gate — `pip-audit` against the runtime dep tree.
    # Replaces the deprecated `safety` CLI (its free DB tier no
    # longer covers most recent CVEs and the `check` subcommand is
    # unsupported past June 2024).
    "pip-audit>=2.7.0,<3.0.0",
]
# Phase 4 (storage) of the observability overhaul: cold-archive writers
# (eden.data_platform.bronze_sink, eden.data_platform.retention) and the
# export runner (eden.exports.runner) prefer Parquet+zstd over NDJSON
# when this is installed, and degrade to NDJSON when it is not — see
# eden.storage.cold_archive. Optional (not in [project.dependencies])
# because the fallback path has zero extra runtime cost; install with
# `pip install -e '.[parquet]'` (or `uv sync --extra parquet`) to get
# the smaller, directly-queryable columnar archive format.
parquet = [
    "pyarrow>=17.0.0,<22.0.0",
]
# GCS export destination (eden.exports.runner). Optional (not in
# [project.dependencies]) because only deployments that configure a
# GCS export destination need it; install with
# `pip install -e '.[gcs]'` (or `uv sync --extra gcs`) to enable
# delivery of scheduled exports to Google Cloud Storage buckets.
gcs = [
    "google-cloud-storage>=2,<4",
]


# Phase 2: the env-gen pipeline (and its `eden` console script entry
# point, which used to launch the legacy thin CLI) has been retired.
# The server is launched via ``uvicorn eden.api.app:app`` (see
# the Dockerfiles). The Eden Agent CLI was deleted entirely in the
# June 2026 backlog cleanup — onboarding now happens through the
# portal wizard + SDK; FrameworkDetector + SDKIntegrator moved to
# src/eden/integrations/.
#
# June 2026 (prod-readiness pass): the ``eden-ops`` console script was
# removed. Operator workflows (rotate API key, dump trace, replay,
# list members, change role, archive org) are all reachable through
# the portal's Settings surface — no separate CLI needed.

[project.scripts]
# F04: eden-mcp starts the MCP stdio server after `pip install -e .`
# Three supported launch paths:
#   (a) monorepo: pip install -e . → eden-mcp
#   (b) module:   python -m eden.mcp_server
#   (c) Docker/API image: eden-mcp is on PATH (same entry point)
eden-mcp = "eden.mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eden"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "supplementaries"]
# ``src`` first so pytest resolves ``eden`` to the app package, not
# the SDK stub under ``sdk/python`` (editable install shadow).
pythonpath = ["src", "."]
addopts = []
filterwarnings = [
    "ignore::DeprecationWarning",
]
# Registered so `-m perf` / `-m "not realdb"` select rather than silently match
# nothing, and so an unregistered marker (a typo) is a visible warning instead
# of a test that quietly never runs.
markers = [
    "perf: timing-sensitive; may be flaky under load or in CI containers",
    "bench: drives bench/ suites; slow, not part of the default run",
    "realdb: requires a live Postgres/ClickHouse rather than the mocked default",
]

[tool.bandit]
targets = ["src/"]
skips = ["B413"]  # blacklist (e.g. crypto) - needed for some valid use cases

# Phase 2: the env-gen LangGraph pipeline is retired; the [tool.langgraph]
# sections above (langchain-core deps, postgres checkpoint config) are gone.