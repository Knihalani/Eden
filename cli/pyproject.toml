[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eden-agent-cli"
version = "0.1.0-eden"
description = "Eden Agent CLI — AI-native agent development (Aider fork)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Eden Team" },
]
keywords = ["eden", "aider", "ai", "agent", "cli", "coding-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "License :: OSI Approved :: Apache Software License",
]

# Aider is Apache 2.0 — Eden is a fork. We pin aider-chat as the upstream
# runtime; our `eden` package is a thin Eden-aware layer that ships its
# own brand, config, API client, context providers, and slash commands.
#
# We deliberately depend on `aider-chat` (the package name published to
# PyPI) rather than vendoring Aider — this keeps the fork merge-friendly
# with upstream and avoids a 200MB monorepo.
dependencies = [
    # Aider runtime (the core TUI + chat loop + repo map + git ops)
    "aider-chat>=0.86.0,<1.0.0",

    # LLM routing
    "litellm>=1.50.0,<2.0.0",

    # HTTP
    "httpx>=0.27.0,<1.0.0",
    "httpx[socks]>=0.27.0,<1.0.0",

    # Terminal
    "prompt-toolkit>=3.0.47,<4.0.0",
    "rich>=13.9.0,<14.0.0",
    "pyyaml>=6.0.0,<7.0.0",

    # Codebase indexing
    "tree-sitter>=0.23.0,<1.0.0",
    "tree-sitter-languages>=1.10.0,<2.0.0",
    "grep-ast>=0.3.0,<1.0.0",
    "networkx>=3.3.0,<4.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "gitpython>=3.1.43,<4.0.0",
    "diskcache>=5.6.0,<6.0.0",

    # Utils
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "structlog>=24.0.0,<25.0.0",
    "tenacity>=8.3.0,<9.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
]

[project.scripts]
eden = "eden.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["eden"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
