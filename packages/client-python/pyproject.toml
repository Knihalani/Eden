[project]
name = "eden-client"
version = "0.0.0"
description = "Python client for the Eden context partner: report agent events, collect injections, ask. Standard library only; fails open."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["agents", "llm", "context", "eden"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eden_client"]

[tool.setuptools.package-data]
eden_client = ["py.typed"]
