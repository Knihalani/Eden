line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
]

[lint.flake8-bugbear]
# B008 used to be ignored wholesale because it fires on FastAPI's
# `x: T = Depends(...)` idiom and on Pydantic `Field(...)`. Both are
# canonical and safe — the default is resolved per-request, not once at
# import. But a blanket ignore also threw away the real cases B008
# exists for (a genuinely mutable default shared across calls), and the
# `--select F,B` CI gate cannot see an `ignore` entry anyway.
#
# Naming the safe callables instead keeps the rule switched on and
# accurate.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Header", "fastapi.Cookie", "fastapi.File", "fastapi.Form",
    "fastapi.Security",
    "Depends", "Query", "Path", "Body", "Header", "Cookie", "File",
    "Form", "Security",
    "pydantic.Field", "Field",
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
# gRPC service method names are PascalCase per the protobuf spec
# (e.g. `async def StreamEvents(...)`); SCIM API uses camelCase
# (`startIndex`). These are non-negotiable external contracts.
"src/eden/realtime/**" = ["N802", "N806"]
"src/eden/api/routes/scim.py" = ["N803", "N815"]
"src/eden/data_platform/quality.py" = ["N801"]
"src/eden/services/usage_service.py" = ["N806"]
"src/eden/observability/ingestion/otel_grpc.py" = ["N802"]
"tests/integration/test_ai_insights.py" = ["N805", "N806"]
# Conditional / lazy imports after sys.path or env setup
"src/eden/api/app.py" = ["E402"]
"src/eden/api/routes/auth.py" = ["E402"]
# Inner `with` depends on the outer context manager
"src/eden/sdk/community_stubs.py" = ["SIM117"]
"src/eden/sdk/openapi_generator.py" = ["SIM117"]
# `l` is too readable as "el" in math-y / math-short contexts
"src/eden/observability/patterns_clusterer.py" = ["E741"]
# Tests use `l` (line), and nested `with` is fine for mocks + setup
"tests/**" = ["F401", "E741", "SIM117", "E402"]
