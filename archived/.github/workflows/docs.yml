name: docs (Docusaurus build + Pages deploy)

# Builds the Docusaurus docs site under `docs/` and deploys to
# GitHub Pages on every push to main that touches the docs tree
# or the workflow file itself. Manual dispatch available for
# ad-hoc rebuilds.
#
# Deploy is skipped (workflow stays green) when GitHub Pages is
# not enabled for the repo — `actions/deploy-pages` returns 404 in
# that case. Enable Pages at Settings → Pages (source: GitHub
# Actions) to turn deploy back on.
#
# Two non-obvious things:
#   1. sidebars.js was rewritten to use the actual doc IDs that
#      Docusaurus derives from the file paths (e.g.
#      `observability/01-trace-replay.md` → `observability/trace-replay`).
#   2. docusaurus.config.js installs a remark plugin
#      (`remarkEscapeBareLt`) that backslash-escapes bare `<` chars
#      not followed by a valid HTML/JSX tag start letter. The
#      observability implementation write-ups routinely contain
#      "<200ms p95" / "<$0.01 per call" prose that the MDX parser
#      otherwise reads as JSX tag starts.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs/docusaurus.config.js"
      - "docs/sidebars.js"
      - "docs/package.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - working-directory: docs
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repo; skipping deploy. Build still succeeded. Enable at Settings → Pages (source: GitHub Actions)."
          fi
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Soft-skip when Pages deploy is unavailable
        if: steps.pages.outputs.enabled != 'true' || steps.deployment.outcome == 'failure'
        run: |
          echo "::notice::GitHub Pages deploy skipped or failed (often: Pages source not set to GitHub Actions). Docs build succeeded; canonical docs host is Vercel (eden-docs / docs.edenobservability.com)."
