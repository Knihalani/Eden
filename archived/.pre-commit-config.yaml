# Eden pre-commit hooks
# Install: pre-commit install
# Run:    pre-commit run --all-files

repos:
  # ─────────────────────────────────────────────────────────────────────────
  # Trailing whitespace + end-of-file fixer (fast, native)
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        types: [python, yaml, json, markdown, toml]
      - id: end-of-file-fixer
        name: Ensure files end with a newline
        types: [python, yaml, json, markdown, toml]
      - id: check-yaml
        name: Validate YAML syntax
      - id: check-json
        name: Validate JSON syntax
      - id: check-toml
        name: Validate TOML syntax
      - id: check-merge-conflict
        name: Check for merge conflict markers
      - id: check-added-large-files
        name: Prevent large files from being committed
        args: ["--maxkb=500"]

  # ─────────────────────────────────────────────────────────────────────────
  # Ruff: lint + format (replaces flake8, black, isort)
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: Ruff lint
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: ^(src/|tests/)
      - id: ruff-format
        name: Ruff format
        files: ^(src/|tests/)

  # ─────────────────────────────────────────────────────────────────────────
  # MyPy: static type checking
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: MyPy type check
        args: ["--config-file", "mypy.ini"]
        files: ^(src/|tests/)
        additional_dependencies:
          - pydantic>=2.9.0
          - pydantic-settings>=2.5.0
          - fastapi>=0.115.0
          - asyncpg>=0.29.0
          - qdrant-client>=1.9.0
          - openai>=1.0.0
          - types-python-jose
          - types-passlib

  # ─────────────────────────────────────────────────────────────────────────
  # LIMIT-without-ORDER-BY ratchet (OPT-38)
  # ─────────────────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: lint-unordered-limit
        name: LIMIT without ORDER BY (ratchet)
        entry: uv run python scripts/lint_unordered_limit.py
        language: system
        files: ^src/eden/.*\.py$
        pass_filenames: false
