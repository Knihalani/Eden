# OTel Collector config — replacement for the in-process sampling +
# K8s enrichment + Pyroscope stack (removed per upgradespec §D.1).
#
# Install: helm install opentelemetry-collector open-telemetry/opentelemetry-collector
#          -f deploy/otel-collector-config.yaml
#
# Pipeline: tail_sampling (N16 intelligence attrs + errors / slow /
#           force_trace / probabilistic) → k8sattributes → batch → otlp/eden
#
# Honest note: edge sampling_percentage below is the *fallback* for traces
# that do not match a keep policy. Eden's in-process N16 soft-launch default
# is ``sampling_profile=full`` (100% keep). For cost reduction set
# ``EDEN_SAMPLING_PROFILE=balanced`` (~15%) on the API (and optionally align
# this collector fallback) — or keep ``full`` when the collector is the only
# sampler and you want edge-only decisions.

processors:
  tail_sampling:
    decision_wait: 10s
    num_traces: 20000
    expected_new_traces_per_sec: 5000
    policies:
      # N16 — never drop Eden intelligence / force tags (SDK or quality worker).
      - name: eden_keep
        type: string_attribute
        string_attribute: { key: eden.keep, values: ["true"] }
      - name: eden_loop
        type: string_attribute
        string_attribute: { key: eden.loop_verdict, values: ["true"] }
      - name: eden_tool_error
        type: string_attribute
        string_attribute: { key: eden.tool_error, values: ["true"] }
      - name: eden_stumble
        type: string_attribute
        string_attribute: { key: eden.stumble, values: ["true"] }
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slow
        type: latency
        latency: { threshold_ms: 5000 }
      - name: force_trace
        type: string_attribute
        string_attribute: { key: eden.force_trace, values: ["true"] }
      # Fallback only — balanced profile ~15%. Raise to 100 when
      # EDEN_SAMPLING_PROFILE=full / sampling_enabled=false.
      - name: probabilistic
        type: probabilistic
        probabilistic: { sampling_percentage: 15 }

  k8sattributes:
    passthrough: false
    auth_type: serviceAccount
    extract:
      metadata: [k8s.pod.name, k8s.namespace.name, k8s.deployment.name]
    # Fall back to Downward API env vars if SA JWT isn't mounted.
    extract_from_env:
      - K8S_POD_NAME
      - K8S_NAMESPACE
      - K8S_DEPLOYMENT_NAME

exporters:
  otlp/eden:
    endpoint: eden-gateway:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, k8sattributes, batch]
      exporters: [otlp/eden]
