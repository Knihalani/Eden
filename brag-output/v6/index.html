<!doctype html>
<html><head><meta charset="utf-8"><title>Eden — v6 system</title>
<style>
@font-face{font-family:Archivo;font-weight:100 900;font-stretch:62% 125%;src:url(fonts/archivo-latin-wdth-normal.woff2)}
@font-face{font-family:Serif;font-style:italic;src:url(fonts/instrument-serif-latin-400-italic.woff2)}
:root{--cream:#ebf7d4;--mint:#66d3a3}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0a0b22}
#c{position:absolute;inset:0;width:1920px;height:1080px}
#ov{position:absolute;inset:0;pointer-events:none}
.t{position:absolute;white-space:nowrap;color:var(--cream);font-family:Archivo;font-stretch:92%;font-weight:560;letter-spacing:-.04em;line-height:.95}
.t em{font-family:Serif;font-style:italic;font-weight:400;letter-spacing:-.015em;color:var(--mint);font-size:1.1em}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.045;mix-blend-mode:screen}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas><div id="ov"></div><canvas id="grain" width="1920" height="1080"></canvas>
<script type="importmap">{"imports":{"three":"./lib/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from './lib/examples/jsm/environments/RoomEnvironment.js';
import {EffectComposer} from './lib/examples/jsm/postprocessing/EffectComposer.js';
import {RenderPass} from './lib/examples/jsm/postprocessing/RenderPass.js';
import {UnrealBloomPass} from './lib/examples/jsm/postprocessing/UnrealBloomPass.js';
import {OutputPass} from './lib/examples/jsm/postprocessing/OutputPass.js';
const W=1920,H=1080; const SHOT=new URLSearchParams(location.search).get('shot')||'A';
/* ============ DESIGN TOKENS (measured from logo_high_fidelity.png) ============ */
const R=1;                 // hex outer radius (vertex)
const STROKE=.30*R;        // ring thickness
const ROUND=.16*R;         // corner rounding
const DEPTH=.34*R;         // extrusion
const GRAD=['#66d3a3','#67d5a8','#5cbdaf','#56b3b7','#4ea3ba','#4187b8','#3c71b5','#3951ae','#353796'];
const BANDS=['#ebf7d4','#73bb64','#5ec0ac','#4996a1','#2f4a85'];
const BG=new THREE.Color('#0a0b22');
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(1); r.setSize(W,H,false); r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.05;
const scene=new THREE.Scene(); scene.background=BG; scene.fog=new THREE.Fog(BG,14,46);
const env=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(r),.04).texture; scene.environment=env;
const cam=new THREE.PerspectiveCamera(24,W/H,.1,200);
const composer=new EffectComposer(r); composer.addPass(new RenderPass(scene,cam)); const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.3,.6,.92); composer.addPass(bloom); composer.addPass(new OutputPass());
/* ---- gradient ramp texture (the logo's vertical gradient) ---- */
function ramp(stops){ const c=document.createElement('canvas'); c.width=4; c.height=256; const x=c.getContext('2d'); const g=x.createLinearGradient(0,0,0,256); stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s)); x.fillStyle=g; x.fillRect(0,0,4,256); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
const RAMP=ramp(GRAD);
/* ---- the one primitive: rounded thick hex ring ---- */
function roundedHex(rad,round,ccw=true){ const pts=[]; for(let i=0;i<6;i++){ const a=Math.PI/2+i*Math.PI/3; pts.push(new THREE.Vector2(Math.cos(a)*rad,Math.sin(a)*rad)); }
  const s=new THREE.Shape(); for(let i=0;i<6;i++){ const p=pts[i], a=pts[(i+5)%6], b=pts[(i+1)%6]; const da=a.clone().sub(p).normalize().multiplyScalar(round*1.6), db=b.clone().sub(p).normalize().multiplyScalar(round*1.6);
    const p0=p.clone().add(da), p1=p.clone().add(db); if(i===0) s.moveTo(p0.x,p0.y); else s.lineTo(p0.x,p0.y); s.quadraticCurveTo(p.x,p.y,p1.x,p1.y); } s.closePath(); return s; }
function hexRingGeo(rad=R){ const s=roundedHex(rad,ROUND); const h=roundedHex(rad-STROKE/Math.cos(Math.PI/6),ROUND*.6); s.holes.push(new THREE.Path(h.getPoints(48).reverse()));
  const g=new THREE.ExtrudeGeometry(s,{depth:DEPTH,bevelEnabled:true,bevelThickness:.05,bevelSize:.045,bevelSegments:5,curveSegments:10}); g.translate(0,0,-DEPTH/2); return g; }
/* material: logo gradient by height within the object (top mint -> bottom indigo), ceramic/glassy coat */
function gradMat(level=1,{rough=.32,coat=1}={}){ const m=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:rough,metalness:0,clearcoat:coat,clearcoatRoughness:.18,envMapIntensity:.55});
  m.onBeforeCompile=sh=>{ sh.uniforms.uRamp={value:RAMP}; sh.uniforms.uLevel={value:level};
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying float vH;').replace('#include <begin_vertex>','#include <begin_vertex>\nvH=clamp(.5-position.y/(2.*'+R.toFixed(3)+'),0.,1.);');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nuniform sampler2D uRamp; uniform float uLevel; varying float vH;')
      .replace('vec4 diffuseColor = vec4( diffuse, opacity );','vec4 diffuseColor = vec4( texture2D(uRamp,vec2(.5,1.-vH)).rgb*uLevel, opacity );');
    m.userData.sh=sh; }; m.customProgramCacheKey=()=>'grad'+level; return m; }
/* landscape bands (the logo's interior), painted into the inner hex */
function bandsTex(){ const c=document.createElement('canvas'); c.width=c.height=1024; const x=c.getContext('2d'); x.fillStyle='#ebf7d4'; x.fillRect(0,0,1024,1024);
  const ys=[470,560,640,720,800]; BANDS.forEach((col,k)=>{ x.fillStyle=col; x.beginPath(); x.moveTo(0,1024); for(let i=0;i<=64;i++){ const X=i/64*1024; x.lineTo(X,ys[k]+Math.sin(X/1024*6.2+k*1.3)*55+Math.sin(X/1024*13+k)*16); } x.lineTo(1024,1024); x.closePath(); x.fill(); });
  x.fillStyle='#2e2e84'; x.fillRect(0,900,1024,124);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
const BT=bandsTex();
function bandsGeo(rad){ const inner=rad-STROKE/Math.cos(Math.PI/6)+.02; const sh=roundedHex(inner,ROUND*.6); const g=new THREE.ShapeGeometry(sh,16); const uv=g.attributes.uv, pos=g.attributes.position;
  for(let i=0;i<uv.count;i++) uv.setXY(i,(pos.getX(i)/inner+1)/2,(pos.getY(i)/inner+1)/2);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:BT,toneMapped:false})); m.position.z=-DEPTH*.2; return m; }
r.localClippingEnabled=true;
/* the </> glyph */
function codeGlyph(size){ const c=document.createElement('canvas'); c.width=512; c.height=256; const x=c.getContext('2d'); x.strokeStyle='#ebf7d4'; x.lineWidth=34; x.lineCap='round'; x.lineJoin='round';
  x.beginPath(); x.moveTo(170,60); x.lineTo(90,128); x.lineTo(170,196); x.moveTo(342,60); x.lineTo(422,128); x.lineTo(342,196); x.moveTo(290,40); x.lineTo(222,216); x.stroke();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return new THREE.Mesh(new THREE.PlaneGeometry(size*2,size),new THREE.MeshBasicMaterial({map:t,transparent:true})); }
/* the logo's e: one continuous rounded stroke around the hex, open on the right with the inner arm */
function eGeo(rad=R){ let pts0; const HX=a=>{ const t=Math.PI/2+a*Math.PI/3; return new THREE.Vector2(Math.cos(t)*rad*.86,Math.sin(t)*rad*.86); };
  let pts=[new THREE.Vector2(.02*rad,.0),new THREE.Vector2(.72*rad,.38*rad),HX(5).clone().setY(.43*rad).multiplyScalar(1),HX(0),HX(1),HX(2),HX(3),HX(4),new THREE.Vector2(HX(4).x,HX(4).y+.18*rad)];
  // replace HX(5) segment end so the right side is open below the arm
  pts.splice(2,1,new THREE.Vector2(HX(5).x,.43*rad));
  const rr=.2*rad; const P2=[pts[0]]; for(let i=1;i<pts.length-1;i++){ const p=pts[i],a=pts[i-1],b=pts[i+1]; const d1=p.clone().sub(a), d2=b.clone().sub(p); const r1=Math.min(rr,d1.length()*.45), r2=Math.min(rr,d2.length()*.45);
    const s0=p.clone().sub(d1.normalize().multiplyScalar(r1)), s1=p.clone().add(d2.normalize().multiplyScalar(r2)); for(let k=0;k<=8;k++){ const t=k/8; P2.push(new THREE.Vector2((1-t)*(1-t)*s0.x+2*(1-t)*t*p.x+t*t*s1.x,(1-t)*(1-t)*s0.y+2*(1-t)*t*p.y+t*t*s1.y)); } } P2.push(pts[pts.length-1]); pts=P2;
  const w=STROKE*1.05; const n=pts.length,L=[],Rr=[];
  for(let i=0;i<n;i++){ const p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)]; const d1=i>0?p.clone().sub(a).normalize():null, d2=i<n-1?b.clone().sub(p).normalize():null; let nr,k=1;
    if(d1&&d2){ const t=d1.clone().add(d2).normalize(); nr=new THREE.Vector2(-t.y,t.x); k=1/Math.max(.4,nr.dot(new THREE.Vector2(-d1.y,d1.x))); } else { const d=d1||d2; nr=new THREE.Vector2(-d.y,d.x); }
    L.push(p.clone().add(nr.clone().multiplyScalar(w/2*k))); Rr.push(p.clone().sub(nr.clone().multiplyScalar(w/2*k))); }
  const sh=new THREE.Shape([...L,...Rr.reverse()]); const g=new THREE.ExtrudeGeometry(sh,{depth:DEPTH,bevelEnabled:true,bevelThickness:.06,bevelSize:.07,bevelSegments:6,curveSegments:8}); g.translate(0,0,-DEPTH/2); return g; }
/* lights: soft key + rim tinted from the palette (no beams) */
const key=new THREE.DirectionalLight(0xffffff,1.6); key.position.set(-4,6,8); scene.add(key);
const rim=new THREE.DirectionalLight(new THREE.Color('#5a62e0'),1.4); rim.position.set(6,-2,-6); scene.add(rim);
scene.add(new THREE.HemisphereLight(new THREE.Color('#66d3a3'),new THREE.Color('#1a1c55'),.35));
/* honeycomb lattice of rings */
const ringGeo=hexRingGeo(R);
const SPX=R*Math.sqrt(3)+.06, SPY=R*1.5+.06;
function lattice(cols,rows,{level=.16,skip=()=>false,z=0}={}){ const grp=new THREE.Group(); const mats=[.035,.05,.065,.08].map(l=>gradMat(l,{rough:.5,coat:.6})); const cells=[];
  const hh=(a,b)=>{ const n=Math.sin(a*127.1+b*311.7)*43758.5; return n-Math.floor(n); };
  for(let j=-rows;j<=rows;j++) for(let i=-cols;i<=cols;i++){ if(skip(i,j)) continue; const dd=Math.hypot(i*.9,j*1.2); if(hh(i,j)<Math.min(.85,.18+dd*.07)) continue; const x=i*SPX+(j&1?SPX/2:0), y=j*SPY; const m=new THREE.Mesh(ringGeo,mats[Math.abs((i*7+j*13))%4]); m.position.set(x,y,z); grp.add(m); cells.push({m,i,j,x,y}); }
  scene.add(grp); grp.userData.cells=cells; return grp; }
const ov=document.getElementById('ov');
function T(html,left,top,size){ const e=document.createElement('div'); e.className='t'; e.style.left=left+'px'; e.style.top=top+'px'; e.style.fontSize=size+'px'; e.innerHTML=html; ov.appendChild(e); return e; }

if(SHOT==='A'){ // a wall of the user's sources, all dim; one cell holds the answer
  const L=lattice(9,6);
  const hot=L.userData.cells.find(c=>c.i===2&&c.j===1); hot.m.material=gradMat(1.0); const b=bandsGeo(R); b.position.set(hot.x,hot.y,0); L.add(b);
  const g=codeGlyph(.16); g.position.set(hot.x,hot.y-R*.55,.01); L.add(g);
  L.rotation.set(-.42,.38,.1); L.position.set(1.2,-.6,0);
  cam.position.set(0,0,17); cam.lookAt(0,0,0);
  T('Somewhere in here',150,770,92); T('is what your agent <em>missed.</em>',150,868,92);
}
if(SHOT==='B'){ // close: the one cell, everything else falls away
  const L=lattice(8,5); L.position.z=-4; L.rotation.set(-.3,.25,0);
  const ring=new THREE.Mesh(eGeo(R),gradMat(1.0)); scene.add(ring); const b=bandsGeo(R*.82); b.position.y=-.06; scene.add(b); const g=codeGlyph(.14); g.position.set(-.02,-R*.5,.02); scene.add(g);
  const hero=new THREE.Group(); [ring,b,g].forEach(o=>hero.add(o)); scene.add(hero); hero.scale.setScalar(2.3); hero.position.set(2.6,.1,0); hero.rotation.set(-.06,-.28,0);
  cam.position.set(0,0,16); cam.lookAt(0,0,0); bloom.strength=.4;
  T('Eden <em>finds it.</em>',150,450,120);
}
const gctx=document.getElementById('grain').getContext('2d'); const im=gctx.createImageData(W,H); for(let i=0;i<im.data.length;i+=4){ const n=Math.random()*255; im.data[i]=im.data[i+1]=im.data[i+2]=n; im.data[i+3]=255; } gctx.putImageData(im,0,0);
window.READY=false; document.fonts.ready.then(async()=>{ for(const f of ['560 20px Archivo','italic 20px Serif']) await document.fonts.load(f); composer.render(); setTimeout(()=>{ composer.render(); window.READY=true; },300); });
</script></body></html>
