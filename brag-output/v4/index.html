<!doctype html>
<html><head><meta charset="utf-8"><title>Eden — v4</title>
<style>
@font-face{font-family:Archivo;font-weight:100 900;font-stretch:62% 125%;src:url(fonts/archivo-latin-wdth-normal.woff2)}
@font-face{font-family:Serif;font-style:italic;src:url(fonts/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:Serif;font-style:normal;src:url(fonts/instrument-serif-latin-400-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#030405}
#c{position:absolute;inset:0;width:1920px;height:1080px}
#ov{position:absolute;inset:0;pointer-events:none}
.t{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;color:#f3f4f2}
.X{font-family:Archivo;font-stretch:118%;font-weight:760;letter-spacing:-.03em;line-height:.9;text-transform:uppercase}
.S{font-family:Serif;font-style:italic;letter-spacing:-.02em}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:screen}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas><div id="ov"></div><canvas id="grain" width="1920" height="1080"></canvas>
<script type="importmap">{"imports":{"three":"./lib/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from './lib/examples/jsm/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from './lib/examples/jsm/geometries/RoundedBoxGeometry.js';
import {EffectComposer} from './lib/examples/jsm/postprocessing/EffectComposer.js';
import {RenderPass} from './lib/examples/jsm/postprocessing/RenderPass.js';
import {UnrealBloomPass} from './lib/examples/jsm/postprocessing/UnrealBloomPass.js';
import {OutputPass} from './lib/examples/jsm/postprocessing/OutputPass.js';
const W=1920,H=1080; const SHOT=new URLSearchParams(location.search).get('shot')||'A';
const TEAL=new THREE.Color('#53e0b0'), BLUE=new THREE.Color('#4694bc'), INDIGO=new THREE.Color('#3a3fd0');
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(1); r.setSize(W,H,false); r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.0;
r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x030405); scene.fog=new THREE.FogExp2(0x030405,.028);
const env=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(r),.04).texture;
const cam=new THREE.PerspectiveCamera(30,W/H,.1,400);
const composer=new EffectComposer(r); composer.addPass(new RenderPass(scene,cam)); const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.9,.6,.6); composer.addPass(bloom); composer.addPass(new OutputPass());
function rng(s){ return ()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- the field: thousands of graphite blocks ---------- */
const NX=70,NZ=44,SP=1.12; const geo=new RoundedBoxGeometry(1,1,1,2,.07);
const mat=new THREE.MeshStandardMaterial({color:0x16181b,metalness:.85,roughness:.32,envMap:env,envMapIntensity:.35});
const field=new THREE.InstancedMesh(geo,mat,NX*NZ); field.castShadow=true; field.receiveShadow=true; scene.add(field);
const R=rng(7), m4=new THREE.Matrix4(), q=new THREE.Quaternion(), v=new THREE.Vector3(), sc=new THREE.Vector3();
const heights=[]; let k=0; const HOT={i:30,j:26};
for(let i=0;i<NX;i++) for(let j=0;j<NZ;j++){ const x=(i-NX/2)*SP, z=(j-NZ/2)*SP-6; const h=.35+Math.pow(R(),3)*1.6+(Math.sin(i*.35)*Math.cos(j*.28)+1)*.18;
  heights.push(h); v.set(x,h/2,z); sc.set(.94,h,.94); q.identity(); m4.compose(v,q,sc); field.setMatrixAt(k++,m4); }
const floor=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:0x050607,roughness:.9,metalness:0})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const hotPos=new THREE.Vector3((HOT.i-NX/2)*SP,0,(HOT.j-NZ/2)*SP-6);
// the one block that matters
const hotMat=new THREE.MeshStandardMaterial({color:0x0c2a22,metalness:.4,roughness:.25,emissive:TEAL,emissiveIntensity:0,envMap:env,envMapIntensity:.6});
const hot=new THREE.Mesh(geo,hotMat); hot.castShadow=true; scene.add(hot);
/* ---------- lights ---------- */
const spot=new THREE.SpotLight(0xe8eef5,900,90,.11,.35,1.6); spot.castShadow=true; spot.shadow.mapSize.set(2048,2048); spot.shadow.bias=-.0003; scene.add(spot); scene.add(spot.target);
const rim=new THREE.DirectionalLight(0x9fb8ff,0); rim.position.set(-20,12,-30); scene.add(rim);
const key=new THREE.DirectionalLight(0xffffff,0); key.position.set(14,22,10); key.castShadow=true; key.shadow.mapSize.set(2048,2048); Object.assign(key.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:120}); scene.add(key);
const hotLight=new THREE.PointLight(TEAL,0,14,1.6); scene.add(hotLight);
/* ---------- the glass mark ---------- */
function hexShape(R0,R1){ const s=new THREE.Shape(); for(let a=0;a<6;a++){ const t=a/6*Math.PI*2+Math.PI/6; const x=Math.cos(t)*R0,y=Math.sin(t)*R0; a?s.lineTo(x,y):s.moveTo(x,y); } s.closePath(); const h=new THREE.Path(); for(let a=5;a>=0;a--){ const t=a/6*Math.PI*2+Math.PI/6; const x=Math.cos(t)*R1,y=Math.sin(t)*R1; a===5?h.moveTo(x,y):h.lineTo(x,y); } h.closePath(); s.holes.push(h); return s; }
function strokeShape(pts,w){ // offset polyline by w/2 both sides with miter joins
  const n=pts.length, L=[], Rr=[];
  for(let i=0;i<n;i++){ const p=pts[i], a=pts[Math.max(0,i-1)], b=pts[Math.min(n-1,i+1)];
    let d1=i>0?new THREE.Vector2(p.x-a.x,p.y-a.y).normalize():null, d2=i<n-1?new THREE.Vector2(b.x-p.x,b.y-p.y).normalize():null;
    let nrm, k=1; if(d1&&d2){ const t=d1.clone().add(d2).normalize(); nrm=new THREE.Vector2(-t.y,t.x); k=1/Math.max(.35,nrm.dot(new THREE.Vector2(-d1.y,d1.x))); } else { const d=d1||d2; nrm=new THREE.Vector2(-d.y,d.x); }
    L.push(new THREE.Vector2(p.x+nrm.x*w/2*k,p.y+nrm.y*w/2*k)); Rr.push(new THREE.Vector2(p.x-nrm.x*w/2*k,p.y-nrm.y*w/2*k)); }
  return new THREE.Shape([...L,...Rr.reverse()]); }
const HX=a=>{ const t=(a*60+30)*Math.PI/180; return new THREE.Vector2(Math.cos(t)*2.3,Math.sin(t)*2.3); };
// e path: inner arm -> right -> up to top-right vertex -> top -> top-left -> bottom-left -> bottom -> bottom-right (open)
const ePts=[new THREE.Vector2(.2,.15),new THREE.Vector2(1.55,.15),HX(0).clone().setY(.6),HX(1),HX(2),HX(3),HX(4),HX(5).clone().multiplyScalar(.98)];
const eShape=strokeShape([new THREE.Vector2(.15,.05),new THREE.Vector2(1.6,.75),HX(0),HX(1),HX(2),HX(3),HX(4),new THREE.Vector2(HX(5).x*.92,HX(5).y*.92+.05)],.78);
const glass=new THREE.Mesh(new THREE.ExtrudeGeometry(eShape,{depth:.9,bevelEnabled:true,bevelThickness:.18,bevelSize:.14,bevelSegments:6,curveSegments:2}),
  new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0,roughness:.04,transmission:1,thickness:1.8,ior:1.6,iridescence:1,iridescenceIOR:1.35,iridescenceThicknessRange:[200,700],envMap:env,envMapIntensity:1.2,clearcoat:1,specularIntensity:1}));
glass.geometry.center(); glass.visible=false; scene.add(glass);
/* ---------- overlay ---------- */
const ov=document.getElementById('ov');
function T(html,y,size,cls){ const e=document.createElement('div'); e.className='t '+cls; e.style.top=y+'px'; e.style.fontSize=size+'px'; e.innerHTML=html; ov.appendChild(e); return e; }
/* ---------- shots ---------- */
if(SHOT==='A'){ // the agent's narrow view
  cam.position.set(-6,10,13); cam.lookAt(.6,0,-1.2);
  mat.envMapIntensity=.05; mat.color.set(0x3a3e44); mat.metalness=.25; mat.roughness=.38; spot.angle=.12; spot.penumbra=.18; spot.decay=0; spot.intensity=7; spot.distance=0;
  spot.position.set(1,24,2); spot.target.position.set(1.2,0,-2.5);
  rim.intensity=.12; bloom.strength=.7; bloom.threshold=.55; scene.fog.density=.03;
  const L=spot.position.distanceTo(spot.target.position); const cone=new THREE.Mesh(new THREE.ConeGeometry(Math.tan(.12)*L,L,48,1,true),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
    uniforms:{L:{value:L}},vertexShader:'varying float vy; varying vec3 vn; varying vec3 vv; void main(){ vy=position.y; vn=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.); vv=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }',
    fragmentShader:'uniform float L; varying float vy; varying vec3 vn; varying vec3 vv; void main(){ float k=(vy/L)+.5; float edge=pow(1.-abs(dot(vn,vv)),1.5); gl_FragColor=vec4(vec3(.85,.9,1.)*.16*k*(1.-edge*.7),1.); }'}));
  cone.position.copy(spot.position).add(spot.target.position).multiplyScalar(.5); cone.lookAt(spot.target.position); cone.rotateX(-Math.PI/2); scene.add(cone);
  T('Your agent sees',770,110,'X'); T('this much.',880,140,'S');
}
if(SHOT==='B'){ // Eden lights the field; one block rises
  cam.position.set(-16,13,18); cam.lookAt(1,0,-6);
  spot.intensity=0; key.intensity=1.1; rim.intensity=1.2; scene.fog.density=.022;
  hot.position.set(hotPos.x,3.2,hotPos.z); hot.scale.set(.94,1.3,.94); hotMat.emissiveIntensity=2.2; hotLight.position.set(hotPos.x,3.4,hotPos.z); hotLight.intensity=60;
  // light column from the block
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.06,.5,60,24,1,true),new THREE.MeshBasicMaterial({color:TEAL,transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide})); beam.position.set(hotPos.x,33,hotPos.z); scene.add(beam);
  bloom.strength=1.0;
  T('Eden sees <i class="S" style="text-transform:none">everything.</i>',100,120,'X');
}
if(SHOT==='C'){ // the glass mark
  scene.fog=null; field.visible=false; hot.visible=false; floor.visible=false;
  for(let i=0;i<9;i++){ const c=new THREE.Color().lerpColors(TEAL,INDIGO,i/8); const b=new THREE.Mesh(new THREE.PlaneGeometry(.07,22),new THREE.MeshBasicMaterial({color:c.clone().multiplyScalar(2.2)})); b.position.set((i-4)*1.15,2,-7); scene.add(b); }
  glass.visible=true; glass.rotation.set(-.08,-.5,.04); glass.position.set(0,3.0,0); glass.scale.setScalar(.66);
  const gl1=new THREE.PointLight(TEAL,220,30,1.5); gl1.position.set(-6,6,4); scene.add(gl1); const gl2=new THREE.PointLight(INDIGO,260,30,1.5); gl2.position.set(6,4,-3); scene.add(gl2); const gl3=new THREE.PointLight(BLUE,140,30,1.5); gl3.position.set(0,-3,6); scene.add(gl3);
  key.intensity=.6; cam.position.set(0,2.6,11.5); cam.lookAt(0,2.0,0); bloom.strength=.55;
  T('Eden',800,150,'X'); T('Context, before they ask.',935,58,'S');
}
// grain
const g=document.getElementById('grain').getContext('2d'); const im=g.createImageData(W,H); for(let i=0;i<im.data.length;i+=4){ const n=Math.random()*255; im.data[i]=im.data[i+1]=im.data[i+2]=n; im.data[i+3]=255; } g.putImageData(im,0,0);
window.READY=false; document.fonts.ready.then(async()=>{ for(const f of ['760 20px Archivo','italic 20px Serif']) await document.fonts.load(f); composer.render(); setTimeout(()=>{ composer.render(); window.READY=true; },300); });
</script></body></html>
