<!doctype html>
<html><head><meta charset="utf-8"><title>Eden — v8 textured</title>
<style>
@font-face{font-family:Book;src:url(fonts/instrument-serif-latin-400-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#07081a}
#c{position:absolute;inset:0;width:1920px;height:1080px}
#ov{position:absolute;inset:0;pointer-events:none}
.t{position:absolute;font-family:Book;font-weight:400;color:#efe9de;letter-spacing:-.005em;line-height:1.08;text-shadow:0 1px 20px rgba(0,0,0,.45);font-kerning:normal}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas><div id="ov"></div>
<script type="importmap">{"imports":{"three":"./lib/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from './lib/examples/jsm/environments/RoomEnvironment.js';
import {EffectComposer} from './lib/examples/jsm/postprocessing/EffectComposer.js';
import {RenderPass} from './lib/examples/jsm/postprocessing/RenderPass.js';
import {BokehPass} from './lib/examples/jsm/postprocessing/BokehPass.js';
import {UnrealBloomPass} from './lib/examples/jsm/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from './lib/examples/jsm/postprocessing/ShaderPass.js';
import {OutputPass} from './lib/examples/jsm/postprocessing/OutputPass.js';
const W=1920,H=1080; const SHOT=new URLSearchParams(location.search).get('shot')||'A';
/* ===== tokens from the logo ===== */
const R=1, STROKE=.30*R, ROUND=.16*R, DEPTH=.34*R;
const GRAD=['#66d3a3','#67d5a8','#5cbdaf','#56b3b7','#4ea3ba','#4187b8','#3c71b5','#3951ae','#353796'];
const BANDS=['#ebf7d4','#73bb64','#5ec0ac','#4996a1','#2f4a85'];
const BG=new THREE.Color('#07081a');
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(1); r.setSize(W,H,false); r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.0;
r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=BG; scene.fog=new THREE.FogExp2(BG,.045);
const env=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(r),.04).texture; scene.environment=env;
const cam=new THREE.PerspectiveCamera(30,W/H,.1,200);
/* ===== procedural surface textures: grain, mottling, scratches ===== */
function hash(n){ n=Math.sin(n*127.1+311.7)*43758.5453; return n-Math.floor(n); }
function noiseCanvas(size,fn){ const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d'); const im=x.createImageData(size,size);
  for(let j=0;j<size;j++) for(let i=0;i<size;i++){ const v=fn(i,j); const k=(j*size+i)*4; im.data[k]=im.data[k+1]=im.data[k+2]=v; im.data[k+3]=255; } x.putImageData(im,0,0); return [c,x]; }
function vn(x,y){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi; const h=(a,b)=>hash(a*157.31+b*311.7); const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf); return (h(xi,yi)*(1-u)+h(xi+1,yi)*u)*(1-v)+(h(xi,yi+1)*(1-u)+h(xi+1,yi+1)*u)*v; }
const fbm=(x,y)=>vn(x,y)*.5+vn(x*2.1,y*2.1)*.27+vn(x*4.3,y*4.3)*.15+vn(x*8.7,y*8.7)*.08;
const S=1024;
const [rc,rx]=noiseCanvas(S,(i,j)=>Math.max(0,Math.min(255,95+(fbm(i/90,j/90)-.5)*120+(hash(i*1.3+j*7.7)-.5)*40)));
rx.strokeStyle='rgba(200,200,200,.35)'; for(let k=0;k<260;k++){ const x0=hash(k)*S,y0=hash(k+9)*S,a=hash(k+3)*6.28,l=10+hash(k+5)*90; rx.lineWidth=.5+hash(k+7)*1.2; rx.beginPath(); rx.moveTo(x0,y0); rx.lineTo(x0+Math.cos(a)*l,y0+Math.sin(a)*l); rx.stroke(); }
const [bc]=noiseCanvas(S,(i,j)=>128+(fbm(i/40,j/40)-.5)*90+(hash(i*2.1+j*5.3)-.5)*60);
const ROUGH=new THREE.CanvasTexture(rc), BUMP=new THREE.CanvasTexture(bc); [ROUGH,BUMP].forEach(t=>{ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(.9,.9); });
function ramp(stops){ const c=document.createElement('canvas'); c.width=4; c.height=256; const x=c.getContext('2d'); const g=x.createLinearGradient(0,0,0,256); stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s)); x.fillStyle=g; x.fillRect(0,0,4,256); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
const RAMP=ramp(GRAD);
function roundedHex(rad,round){ const pts=[]; for(let i=0;i<6;i++){ const a=Math.PI/2+i*Math.PI/3; pts.push(new THREE.Vector2(Math.cos(a)*rad,Math.sin(a)*rad)); }
  const s=new THREE.Shape(); for(let i=0;i<6;i++){ const p=pts[i],a=pts[(i+5)%6],b=pts[(i+1)%6]; const p0=p.clone().add(a.clone().sub(p).normalize().multiplyScalar(round*1.6)), p1=p.clone().add(b.clone().sub(p).normalize().multiplyScalar(round*1.6)); if(i===0) s.moveTo(p0.x,p0.y); else s.lineTo(p0.x,p0.y); s.quadraticCurveTo(p.x,p.y,p1.x,p1.y); } s.closePath(); return s; }
function hexRingGeo(rad=R){ const s=roundedHex(rad,ROUND); const h=roundedHex(rad-STROKE/Math.cos(Math.PI/6),ROUND*.6); s.holes.push(new THREE.Path(h.getPoints(48).reverse()));
  const g=new THREE.ExtrudeGeometry(s,{depth:DEPTH,bevelEnabled:true,bevelThickness:.05,bevelSize:.045,bevelSegments:5,curveSegments:10}); g.translate(0,0,-DEPTH/2); return g; }
function gradMat(level=1,{rough=.55,coat=.5,bump=.012}={}){ const m=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:rough,roughnessMap:ROUGH,bumpMap:BUMP,bumpScale:bump,metalness:0,clearcoat:coat,clearcoatRoughness:.35,clearcoatRoughnessMap:ROUGH,envMapIntensity:.4,sheen:.4,sheenRoughness:.6,sheenColor:new THREE.Color('#bfe8dc')});
  m.onBeforeCompile=sh=>{ sh.uniforms.uRamp={value:RAMP}; sh.uniforms.uLevel={value:level};
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying float vH; varying vec3 vObj;').replace('#include <begin_vertex>','#include <begin_vertex>\nvH=clamp(.5-position.y/2.,0.,1.); vObj=position;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nuniform sampler2D uRamp; uniform float uLevel; varying float vH; varying vec3 vObj;\nfloat h3(vec3 p){ return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453); }\nfloat n3(vec3 p){ vec3 i=floor(p),f=fract(p); f=f*f*(3.-2.*f); return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }')
      .replace('vec4 diffuseColor = vec4( diffuse, opacity );','float mott=.9+.14*n3(vObj*6.)+.06*n3(vObj*23.); vec4 diffuseColor = vec4( texture2D(uRamp,vec2(.5,1.-vH)).rgb*uLevel*mott, opacity );'); };
  m.customProgramCacheKey=()=>'g8'+level; return m; }
function bandsTex(){ const c=document.createElement('canvas'); c.width=c.height=1024; const x=c.getContext('2d'); x.fillStyle='#ebf7d4'; x.fillRect(0,0,1024,1024);
  const ys=[470,560,640,720,800]; BANDS.forEach((col,k)=>{ x.fillStyle=col; x.beginPath(); x.moveTo(0,1024); for(let i=0;i<=64;i++){ const X=i/64*1024; x.lineTo(X,ys[k]+Math.sin(X/1024*6.2+k*1.3)*55+Math.sin(X/1024*13+k)*16); } x.lineTo(1024,1024); x.closePath(); x.fill(); });
  x.fillStyle='#2e2e84'; x.fillRect(0,900,1024,124);
  const im=x.getImageData(0,0,1024,1024); for(let i=0;i<im.data.length;i+=4){ const n=(Math.random()-.5)*26; im.data[i]+=n; im.data[i+1]+=n; im.data[i+2]+=n; } x.putImageData(im,0,0); // paper grain
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
const BT=bandsTex();
function bandsGeo(rad){ const inner=rad-STROKE/Math.cos(Math.PI/6)+.02; const sh=roundedHex(inner,ROUND*.6); const g=new THREE.ShapeGeometry(sh,16); const uv=g.attributes.uv,pos=g.attributes.position;
  for(let i=0;i<uv.count;i++) uv.setXY(i,(pos.getX(i)/inner+1)/2,(pos.getY(i)/inner+1)/2);
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:BT,roughness:.85,emissive:0xffffff,emissiveMap:BT,emissiveIntensity:.18})); m.position.z=-DEPTH*.2; m.receiveShadow=true; return m; }
/* lights: one hard low key with shadows, cool rim, faint fill */
const key=new THREE.DirectionalLight(0xfff1df,3.2); key.position.set(-7,5,6); key.castShadow=true; key.shadow.mapSize.set(4096,4096); Object.assign(key.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:60}); key.shadow.bias=-.0003; key.shadow.normalBias=.02; scene.add(key);
const rim=new THREE.DirectionalLight(new THREE.Color('#5a62e0'),.7); rim.position.set(8,-1,-7); scene.add(rim);
scene.add(new THREE.HemisphereLight(new THREE.Color('#3a6f6a'),new THREE.Color('#0d0e2a'),.25));
const ringGeo=hexRingGeo(R); const SPX=R*Math.sqrt(3)+.05, SPY=R*1.5+.05;
function field(cols,rows){ const grp=new THREE.Group(); const mats=[.045,.06,.075,.09].map(l=>gradMat(l,{coat:.35})); const cells=[];
  for(let j=-rows;j<=rows;j++) for(let i=-cols;i<=cols;i++){ const x=i*SPX+(j&1?SPX/2:0), y=j*SPY; const z=(hash(i*3.1+j*7.3)-.5)*.6; const m=new THREE.Mesh(ringGeo,mats[Math.abs(i*7+j*13)%4]); m.position.set(x,y,z); m.rotation.z=(hash(i+j*9)-.5)*.05; m.castShadow=m.receiveShadow=true; grp.add(m); cells.push({m,i,j,x,y,z}); }
  // a back plate catches shadows through the holes
  const back=new THREE.Mesh(new THREE.PlaneGeometry(80,60),new THREE.MeshStandardMaterial({color:'#05060f',roughness:.95,roughnessMap:ROUGH,bumpMap:BUMP,bumpScale:.02})); back.position.z=-1.1; back.receiveShadow=true; grp.add(back);
  scene.add(grp); grp.userData.cells=cells; return grp; }
/* dust in the light */
function dust(n,box){ const g=new THREE.BufferGeometry(); const p=new Float32Array(n*3),s=new Float32Array(n); for(let i=0;i<n;i++){ p[i*3]=(hash(i)-.5)*box[0]; p[i*3+1]=(hash(i+3)-.5)*box[1]; p[i*3+2]=(hash(i+7)-.5)*box[2]; s[i]=hash(i+11); }
  g.setAttribute('position',new THREE.BufferAttribute(p,3)); g.setAttribute('aS',new THREE.BufferAttribute(s,1));
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexShader:'attribute float aS; varying float vS; void main(){ vS=aS; vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=(1.2+aS*3.)*(14./-mv.z); gl_Position=projectionMatrix*mv; }',
    fragmentShader:'varying float vS; void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,.0,d); gl_FragColor=vec4(vec3(1.,.95,.88)*a*(.12+.25*vS),1.); }'}); const pts=new THREE.Points(g,m); scene.add(pts); return pts; }
/* post: DOF, bloom, then film (halation, CA, grain, vignette) */
const composer=new EffectComposer(r); composer.addPass(new RenderPass(scene,cam));
const bokeh=new BokehPass(scene,cam,{focus:12,aperture:.0018,maxblur:.012}); composer.addPass(bokeh);
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.22,.6,.9); composer.addPass(bloom);
const film=new ShaderPass({uniforms:{tDiffuse:{value:null},uSeed:{value:Math.random()*10}},vertexShader:'varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse; uniform float uSeed; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233))+uSeed)*43758.5453); }
  void main(){ vec2 d=vUv-.5; float r2=dot(d,d); vec3 c; c.r=texture2D(tDiffuse,vUv-d*.0035).r; c.g=texture2D(tDiffuse,vUv).g; c.b=texture2D(tDiffuse,vUv+d*.0035).b;
    vec3 hal=vec3(0.); for(int i=0;i<8;i++){ float a=float(i)*.785; hal+=texture2D(tDiffuse,vUv+vec2(cos(a),sin(a))*.004).rgb; } hal/=8.; c+=max(hal-.55,0.)*vec3(.55,.18,.08)*1.2;
    c*=1.-.6*smoothstep(.12,.55,r2); float g=h(vUv*vec2(1920.,1080.))-.5; c+=g*.05*(.4+.6*(1.-c.g));
    gl_FragColor=vec4(c,1.); }`}); composer.addPass(film); composer.addPass(new OutputPass());
const ov=document.getElementById('ov'); function T(html,css){ const e=document.createElement('div'); e.className='t'; e.style.cssText=css; e.innerHTML=html; ov.appendChild(e); return e; }

if(SHOT==='A'){ // close, off-axis: the field, one cell holds the answer
  const F=field(10,7); F.rotation.set(-.55,.62,.18);
  const hot=F.userData.cells.find(c=>c.i===1&&c.j===0); hot.m.material=gradMat(1.0); hot.m.position.z+=.25; const b=bandsGeo(R); b.position.set(hot.x,hot.y,hot.m.position.z); F.add(b);
  cam.position.set(-1.5,.4,9.5); cam.lookAt(1.2,.1,0); bokeh.uniforms.focus.value=9.2; bokeh.uniforms.aperture.value=.0028;
  key.intensity=.35; scene.traverse(o=>{ if(o.isHemisphereLight) o.intensity=.08; }); new Set(F.userData.cells.filter(c=>c!==hot).map(c=>c.m.material)).forEach(m=>m.envMapIntensity=.12);
  const sp=new THREE.SpotLight(0xfff0dc,260,0,.32,.85,1.6); const hp=hot.m.getWorldPosition(new THREE.Vector3()); sp.position.copy(hp).add(new THREE.Vector3(-5,4,7)); sp.target.position.copy(hp); sp.castShadow=true; sp.shadow.mapSize.set(2048,2048); sp.shadow.bias=-.0003; scene.add(sp,sp.target);
  dust(900,[14,8,10]);
  T('Somewhere in here is the thing your agent missed.','left:0;right:0;text-align:center;top:930px;font-size:52px');
}
if(SHOT==='B'){ // the hero e, raking light, field soft behind
  const F=field(8,6); F.position.z=-5; F.rotation.set(-.35,.4,.1);
  const HX=a=>{ const t=Math.PI/2+a*Math.PI/3; return new THREE.Vector2(Math.cos(t)*R*.86,Math.sin(t)*R*.86); };
  let pts=[new THREE.Vector2(.02,0),new THREE.Vector2(.72,.38),new THREE.Vector2(HX(5).x,.43),HX(0),HX(1),HX(2),HX(3),HX(4),new THREE.Vector2(HX(4).x,HX(4).y+.18)];
  const rr=.2; const P2=[pts[0]]; for(let i=1;i<pts.length-1;i++){ const p=pts[i],a=pts[i-1],b=pts[i+1]; const d1=p.clone().sub(a),d2=b.clone().sub(p); const r1=Math.min(rr,d1.length()*.45),r2=Math.min(rr,d2.length()*.45); const s0=p.clone().sub(d1.normalize().multiplyScalar(r1)),s1=p.clone().add(d2.normalize().multiplyScalar(r2)); for(let k=0;k<=8;k++){ const t=k/8; P2.push(new THREE.Vector2((1-t)*(1-t)*s0.x+2*(1-t)*t*p.x+t*t*s1.x,(1-t)*(1-t)*s0.y+2*(1-t)*t*p.y+t*t*s1.y)); } } P2.push(pts[pts.length-1]); pts=P2;
  const w=STROKE*1.05, n=pts.length, L=[], Rr=[]; for(let i=0;i<n;i++){ const p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)]; const d1=i>0?p.clone().sub(a).normalize():null,d2=i<n-1?b.clone().sub(p).normalize():null; let nr,k=1; if(d1&&d2){ const t=d1.clone().add(d2).normalize(); nr=new THREE.Vector2(-t.y,t.x); k=1/Math.max(.4,nr.dot(new THREE.Vector2(-d1.y,d1.x))); } else { const d=d1||d2; nr=new THREE.Vector2(-d.y,d.x); } L.push(p.clone().add(nr.clone().multiplyScalar(w/2*k))); Rr.push(p.clone().sub(nr.clone().multiplyScalar(w/2*k))); }
  const eg=new THREE.ExtrudeGeometry(new THREE.Shape([...L,...Rr.reverse()]),{depth:DEPTH,bevelEnabled:true,bevelThickness:.06,bevelSize:.07,bevelSegments:6,curveSegments:8}); eg.translate(0,0,-DEPTH/2);
  const e=new THREE.Mesh(eg,gradMat(1.0,{bump:.01})); e.castShadow=e.receiveShadow=true; const b=bandsGeo(R*.82); b.position.y=-.06;
  const hero=new THREE.Group(); hero.add(e); hero.add(b); scene.add(hero); hero.scale.setScalar(1.8); hero.rotation.set(-.12,-.55,.05); hero.position.set(.6,.15,0);
  key.position.set(-9,3,4); key.intensity=2.4; rim.intensity=.4; r.toneMappingExposure=.9;
  cam.position.set(-.8,.2,8.6); cam.lookAt(.5,.1,0); bokeh.uniforms.focus.value=8.4; bokeh.uniforms.aperture.value=.0022;
  dust(700,[12,7,9]);
  T('Eden','left:150px;top:790px;font-size:96px'); T('Context, before they ask.','left:154px;top:905px;font-size:40px;opacity:.85');
}
window.READY=false; document.fonts.ready.then(()=>document.fonts.load('20px Book')).then(()=>{ composer.render(); setTimeout(()=>{ composer.render(); window.READY=true; },400); });
</script></body></html>
