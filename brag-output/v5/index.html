<!doctype html>
<html><head><meta charset="utf-8"><title>Eden — v5</title>
<style>
@font-face{font-family:Archivo;font-weight:100 900;font-stretch:62% 125%;src:url(fonts/archivo-latin-wdth-normal.woff2)}
@font-face{font-family:Serif;font-style:italic;src:url(fonts/instrument-serif-latin-400-italic.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#04050a}
#c{position:absolute;inset:0;width:1920px;height:1080px}
#ov{position:absolute;inset:0;pointer-events:none}
.t{position:absolute;left:150px;white-space:nowrap;color:#eef1f0;font-family:Archivo;font-stretch:96%;font-weight:520;letter-spacing:-.045em;line-height:.92;font-feature-settings:"ss01"}
.t em{font-family:Serif;font-style:italic;font-weight:400;letter-spacing:-.02em;font-size:1.12em;padding-right:.06em;
  background:linear-gradient(90deg,#8fe3b4 0%,#53c7c0 35%,#5a9be0 70%,#7a7cf0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:screen}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas><div id="ov"></div><canvas id="grain" width="1920" height="1080"></canvas>
<script type="importmap">{"imports":{"three":"./lib/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from './lib/examples/jsm/environments/RoomEnvironment.js';
import {EffectComposer} from './lib/examples/jsm/postprocessing/EffectComposer.js';
import {RenderPass} from './lib/examples/jsm/postprocessing/RenderPass.js';
import {UnrealBloomPass} from './lib/examples/jsm/postprocessing/UnrealBloomPass.js';
import {OutputPass} from './lib/examples/jsm/postprocessing/OutputPass.js';
const W=1920,H=1080; const SHOT=new URLSearchParams(location.search).get('shot')||'A';
// the logo's own palette, front (green) to back (indigo)
const PAL=['#9fe08a','#6fd3a0','#4fc0b4','#4aa6c8','#4a86d0','#4a62c8','#3f45b8','#2f2f96'].map(c=>new THREE.Color(c));
const pal=t=>{ t=Math.min(.999,Math.max(0,t))*(PAL.length-1); const i=Math.floor(t); return PAL[i].clone().lerp(PAL[i+1],t-i); };
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(1); r.setSize(W,H,false); r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.0;
r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x04050a); scene.fog=new THREE.Fog(0x04050a,18,70);
const env=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(r),.04).texture;
const cam=new THREE.PerspectiveCamera(26,W/H,.1,400);
const composer=new EffectComposer(r); composer.addPass(new RenderPass(scene,cam)); const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.55,.7,.7); composer.addPass(bloom); composer.addPass(new OutputPass());

/* ---------- the landscape: stacked ridges, like the inside of the logo ---------- */
const NL=34, WIDTH=46, DEPTH=1.35;
function ridgeY(x,k){ const a=k*.37; return 1.2+Math.sin(x*.16+a)*1.1+Math.sin(x*.41+a*2.1)*.45+Math.sin(x*.07-a*.6)*1.6*(1-k/NL*.5)+Math.sin(x*1.1+a*3.3)*.08; }
const layers=[];
for(let k=0;k<NL;k++){ const s=new THREE.Shape(); const x0=-WIDTH/2,x1=WIDTH/2; s.moveTo(x0,-3); for(let i=0;i<=220;i++){ const x=x0+(x1-x0)*i/220; s.lineTo(x,ridgeY(x,k)); } s.lineTo(x1,-3); s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:.16,bevelEnabled:true,bevelThickness:.05,bevelSize:.05,bevelSegments:3,curveSegments:1,steps:1});
  const c=pal(k/(NL-1));
  const m=new THREE.MeshPhysicalMaterial({color:c,roughness:.42,metalness:0,clearcoat:.6,clearcoatRoughness:.3,sheen:1,sheenColor:c.clone().lerp(new THREE.Color('#ffffff'),.5),sheenRoughness:.5,envMap:env,envMapIntensity:.25,emissive:c,emissiveIntensity:0});
  const mesh=new THREE.Mesh(g,m); mesh.position.z=-k*DEPTH; mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh); layers.push(mesh); }
const amb=new THREE.HemisphereLight(0x8fa8ff,0x05060a,.0); scene.add(amb);
const key=new THREE.DirectionalLight(0xfff4e8,0); key.castShadow=true; key.shadow.mapSize.set(4096,4096); Object.assign(key.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:1,far:120}); key.shadow.bias=-.0004; key.shadow.radius=4; scene.add(key); scene.add(key.target);
const slit=new THREE.SpotLight(0xf2f6ff,0,0,.05,.12,0); slit.castShadow=true; slit.shadow.mapSize.set(2048,2048); scene.add(slit); scene.add(slit.target);
/* ---------- overlay ---------- */
const ov=document.getElementById('ov');
function T(html,top,size){ const e=document.createElement('div'); e.className='t'; e.style.top=top+'px'; e.style.fontSize=size+'px'; e.innerHTML=html; ov.appendChild(e); return e; }

if(SHOT==='A'){ // the agent sees a sliver: one grazing slit of light across the dark terrain
  cam.position.set(-2,7,16); cam.lookAt(2,.6,-14);
  slit.intensity=60; slit.angle=.045; slit.penumbra=.35; slit.position.set(34,4.2,-10); slit.target.position.set(0,1.4,-10.5);
  amb.intensity=0; layers.forEach(l=>{ l.material.envMapIntensity=0; l.material.sheen=0; l.material.clearcoat=.2; }); slit.intensity=140; bloom.strength=.6;
  T('Your agent sees',110,120); T('a <em>sliver.</em>',232,120);
}
if(SHOT==='B'){ // Eden sees the whole landscape; one ridge crest carries the answer
  cam.position.set(-6,8,15); cam.lookAt(1,1.4,-14);
  key.intensity=1.1; key.position.set(-24,10,-2); r.toneMappingExposure=.85; key.target.position.set(0,0,-18); amb.intensity=.35; bloom.strength=.45;
  const hk=11; layers[hk].material=layers[hk].material.clone(); layers[hk].material.emissive=new THREE.Color('#9ff5cf'); layers[hk].material.emissiveIntensity=1.2;
  const glow=new THREE.PointLight(0x9ff5cf,90,14,1.6); glow.position.set(3,ridgeY(3,hk)+1.2,-hk*DEPTH+.6); scene.add(glow);
  layers.forEach(l=>{ l.material.envMapIntensity=.12; l.material.sheen=.5; }); T('Eden sees',110,120); T('<em>all of it.</em>',232,120);
}
if(SHOT==='C'){ // the logo, built: a glass e that holds the landscape
  scene.fog=null; layers.forEach((l,k)=>{ l.position.z=-k*.024+.4; l.scale.set(.068,.17,.15); l.position.x=0; l.position.y=-1.05; });
  const HX=a=>{ const t=(a*60+30)*Math.PI/180; return new THREE.Vector2(Math.cos(t)*2.3,Math.sin(t)*2.3); };
  function strokeShape(pts,w){ const n=pts.length,L=[],R=[]; for(let i=0;i<n;i++){ const p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];
      const d1=i>0?new THREE.Vector2(p.x-a.x,p.y-a.y).normalize():null, d2=i<n-1?new THREE.Vector2(b.x-p.x,b.y-p.y).normalize():null; let nrm,k=1;
      if(d1&&d2){ const t=d1.clone().add(d2).normalize(); nrm=new THREE.Vector2(-t.y,t.x); k=1/Math.max(.35,nrm.dot(new THREE.Vector2(-d1.y,d1.x))); } else { const d=d1||d2; nrm=new THREE.Vector2(-d.y,d.x); }
      L.push(new THREE.Vector2(p.x+nrm.x*w/2*k,p.y+nrm.y*w/2*k)); R.push(new THREE.Vector2(p.x-nrm.x*w/2*k,p.y-nrm.y*w/2*k)); } return new THREE.Shape([...L,...R.reverse()]); }
  const eShape=strokeShape([new THREE.Vector2(.15,.05),new THREE.Vector2(1.6,.75),HX(0),HX(1),HX(2),HX(3),HX(4),new THREE.Vector2(HX(5).x*.92,HX(5).y*.92+.05)],.78);
  const glass=new THREE.Mesh(new THREE.ExtrudeGeometry(eShape,{depth:.9,bevelEnabled:true,bevelThickness:.16,bevelSize:.12,bevelSegments:6}),
    new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.05,transmission:1,thickness:1.6,ior:1.55,iridescence:.6,iridescenceIOR:1.3,envMap:env,envMapIntensity:1.1,clearcoat:1}));
  glass.geometry.center(); glass.position.set(0,0,.9); scene.add(glass);
  const grp=new THREE.Group(); scene.add(grp); grp.add(glass); layers.forEach(l=>grp.add(l)); grp.rotation.set(-.04,-.3,0); grp.position.set(3.0,.15,0); grp.scale.setScalar(.74);
  key.intensity=2.2; key.position.set(-6,8,10); key.target.position.set(3,0,0); amb.intensity=.5;
  const l1=new THREE.PointLight(0x6fd3a0,80,20,1.5); l1.position.set(-1,4,-3); scene.add(l1); const l2=new THREE.PointLight(0x4a62c8,110,20,1.5); l2.position.set(7,-2,3); scene.add(l2);
  cam.position.set(0,.4,13); cam.lookAt(0,0,0); bloom.strength=.4;
  T('Eden',360,190); T('Context, <em>before</em>',560,92); T('<em>they ask.</em>',655,92);
}
const g=document.getElementById('grain').getContext('2d'); const im=g.createImageData(W,H); for(let i=0;i<im.data.length;i+=4){ const n=Math.random()*255; im.data[i]=im.data[i+1]=im.data[i+2]=n; im.data[i+3]=255; } g.putImageData(im,0,0);
window.READY=false; document.fonts.ready.then(async()=>{ for(const f of ['520 20px Archivo','italic 20px Serif']) await document.fonts.load(f); composer.render(); setTimeout(()=>{ composer.render(); window.READY=true; },300); });
</script></body></html>
