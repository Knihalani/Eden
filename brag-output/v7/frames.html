<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Book;src:url(fonts/instrument-serif-latin-400-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box} html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#p{position:absolute;inset:0;background-size:cover}
#v{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 50%,rgba(0,0,0,.42) 100%)}
#g{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay}
.t{position:absolute;font-family:Book;font-weight:400;color:#f4efe6;letter-spacing:-.005em;line-height:1.08;text-shadow:0 1px 18px rgba(0,0,0,.25);font-kerning:normal;font-feature-settings:"liga","kern"}
</style></head><body><div id="p"></div><div id="v"></div><canvas id="g" width="1920" height="1080"></canvas><div id="T"></div>
<script>
const f=new URLSearchParams(location.search).get('f'); document.getElementById('p').style.backgroundImage=`url(plates/${f}.png)`;
const T=document.getElementById('T'); const t=(html,css)=>{ const e=document.createElement('div'); e.className='t'; e.style.cssText=css; e.innerHTML=html; T.appendChild(e); };
if(f==='a') t('Your agent knows what you ask.','left:0;right:0;text-align:center;top:860px;font-size:66px');
if(f==='b') t('Not what you didn’t say.','left:0;right:0;text-align:center;top:860px;font-size:66px');
if(f==='c'){ const s=document.createElement('div'); s.style.cssText='position:absolute;inset:0;background:radial-gradient(ellipse 900px 380px at 50% 46%,rgba(10,14,12,.38),rgba(0,0,0,0))'; T.appendChild(s); t('Eden','left:0;right:0;text-align:center;top:380px;font-size:150px;letter-spacing:-.01em'); t('Context, before they ask.','left:0;right:0;text-align:center;top:560px;font-size:48px'); }
const g=document.getElementById('g').getContext('2d'); const im=g.createImageData(1920,1080); for(let i=0;i<im.data.length;i+=4){ const n=128+(Math.random()-.5)*255; im.data[i]=im.data[i+1]=im.data[i+2]=n; im.data[i+3]=255; } g.putImageData(im,0,0);
document.fonts.ready.then(()=>document.fonts.load('20px Book')).then(()=>{ window.READY=true; });
</script></body></html>
