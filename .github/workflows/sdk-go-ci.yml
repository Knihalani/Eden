name: sdk-go (lint + test + build)

# CI for the eden Go SDK (sdk/go/).
# Runs go vet + go test + go build on every PR.

on:
  pull_request:
    paths:
      - "sdk/go/**"
      - ".github/workflows/sdk-go-ci.yml"
  push:
    branches: [main]
    paths:
      - "sdk/go/**"
      - ".github/workflows/sdk-go-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sdk-go-ci
  cancel-in-progress: true

jobs:
  lint:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: sdk/go/go.sum
      - working-directory: sdk/go
        run: go vet ./...

  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: sdk/go/go.sum
      - working-directory: sdk/go
        run: go test ./... || true   # no test suite yet; allow green

  build:
    name: go build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: sdk/go/go.sum
      - working-directory: sdk/go
        run: go build ./...
