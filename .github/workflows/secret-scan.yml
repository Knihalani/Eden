name: secret-scan

# Added after the 2026-08 committed-.env incident (history purged, all
# credentials rotated — see docs/ops/credential-rotation-2026-08.md).
#
# Two legs:
#   1. PR / push diff scan — cheap, gates every change.
#   2. Weekly full-history scan — catches anything that slips into any branch.

on:
  pull_request:
  push:
    branches: [main, feat/sdk-ts-ai-batch-a4]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-diff:
    name: gitleaks (diff)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks on the change range
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitleaks-full-history:
    name: gitleaks (full history, weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan entire git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
