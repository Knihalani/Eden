name: DR drill

# SOTA Wave 9 — scheduled disaster-recovery restore smoke.
# Seeds a backup via scripts/backup_postgres.sh, then invokes
# scripts/dr_drill.sh. Failures propagate; soft-fail escapes are gone.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/dr_drill.sh"
      - "scripts/backup_postgres.sh"
      - ".github/workflows/dr-drill.yml"

jobs:
  dr-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Take Postgres backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_LOCAL_DIR: ./backups
          REPORT_DIR: ./reports
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: bash scripts/backup_postgres.sh
      - name: Run DR drill script
        env:
          BACKUP_LOCAL_DIR: ./backups
          REPORT_DIR: ./reports
        run: bash scripts/dr_drill.sh
      - name: Upload DR report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-drill-report
          path: reports/dr-drill-*.json
          if-no-files-found: ignore
