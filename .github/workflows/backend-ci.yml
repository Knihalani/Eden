name: backend (lint + test + build)

# CI for the FastAPI backend. Catches the kind of issues that
# previously broke Northflank builds (e.g. pyproject.toml out of
# sync with uv.lock, missing runtime deps, alembic revisions with
# wrong down_revision pointers).

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic/**"
      - "Dockerfile"
      - ".github/workflows/backend-ci.yml"
      - "docs/ops/migration-matrix.md"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic/**"
      - "Dockerfile"
      - ".github/workflows/backend-ci.yml"
      - "docs/ops/migration-matrix.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backend-ci
  cancel-in-progress: true

jobs:
  lock-check:
    name: uv.lock is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Check pyproject vs uv.lock
        run: uv lock --check

  audit:
    name: pip-audit (runtime deps)
    # Runs ``pip-audit`` against the resolved runtime dep tree
    # (excludes the [dev] extra so it doesn't flag test-only deps).
    # Replaces the in-repo ``safety check`` call that the 2026-07-07
    # dep audit retired — ``safety``'s free DB tier no longer covers
    # most recent CVEs and the ``check`` subcommand is unsupported
    # past June 2024.
    runs-on: ubuntu-latest
    needs: lock-check
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Export runtime deps
        # Mirrors the production `uv sync --no-dev` tree so the audit
        # only checks what actually ships to prod. Strip the editable
        # ``-e .`` line — pip-audit cannot deduce a version from it.
        run: |
          uv export --no-hashes --format requirements-txt --no-dev > /tmp/runtime-reqs.txt
          grep -v '^-e \.' /tmp/runtime-reqs.txt > /tmp/runtime-reqs-audit.txt
          mv /tmp/runtime-reqs-audit.txt /tmp/runtime-reqs.txt
      - name: pip-audit (fail on any known vuln)
        # ``pip-audit`` is the upstream-maintained replacement for
        # ``safety``: it pulls from the PyPI Advisory DB and OSV.
        # The strict mode blocks the build on any known vulnerability.
        # ``--no-deps`` skips pip resolution inside the container
        # (the resolved tree is already pinned by uv.lock).
        run: uvx pip-audit --strict --no-deps --disable-pip -r /tmp/runtime-reqs.txt

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    needs: lock-check
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --frozen --all-extras

      # BLOCKING. pyflakes (F) and bugbear (B) are the families that
      # catch defects rather than style: unused/shadowed names, closures
      # that don't bind the loop variable, mutable defaults, unused loop
      # controls. The 2026-07-29 audit found four real bugs sitting in
      # this output while the gate was `|| true` — a B023 closure bug in
      # the quality pipeline, an F841 in signals/backfill that marked a
      # dropped signal_id, an F811 shadowing `asyncio`, and a B007 loop
      # in evaluation/regression_builder whose body had been refactored
      # away entirely so it just spun. All are fixed and this is now
      # green, so it stays green.
      #
      # B008 is excluded for now and only for now. It was globally
      # ignored until 2026-07-29 because it fires on FastAPI's
      # `= Depends(...)` idiom; naming the safe callables in
      # ruff.toml's flake8-bugbear section cut it from "every route
      # signature in the repo" to 54, and some of those look genuine
      # (`body: SeedDefaultsRequest = SeedDefaultsRequest()` really is
      # one instance shared across requests). Clear those 54, then drop
      # this --ignore.
      - name: ruff (bug-class rules — blocking)
        run: uv run ruff check src/ --select F,B --ignore B008

      # Informational. The remaining ~198 findings are style families
      # (N815 mixed-case in class scope, SIM105/102, E402) that need a
      # deliberate sweep. Flip to blocking per-family as each is cleared
      # rather than in one big-bang change.
      - name: ruff (style — informational)
        run: uv run ruff check src/ || true

      - run: uv run mypy src/ || true
        # mypy is informational only — flip to non-zero exit once the
        # cleanup pass tracked in eden-audit-phase8 lands.

  test:
    name: pytest
    runs-on: ubuntu-latest
    needs: [lock-check, audit]
    services:
      postgres:
        # Use the TimescaleDB HA image rather than plain postgres:16 —
        # the migrations create both the `vector` (pgvector) and
        # `timescaledb` extensions, and the stock postgres image
        # doesn't ship either extension's binaries.
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: eden
          POSTGRES_PASSWORD: eden
          POSTGRES_DB: eden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://eden:eden@localhost:5432/eden_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: eden
      POSTGRES_PASSWORD: eden
      POSTGRES_DB: eden_test
      POSTGRES_SSLMODE: disable
      JWT_SECRET: test-secret-do-not-use-in-prod-32chars
      ENCRYPTION_KEY: test-encryption-key-must-be-32-chars-long!
      SESSION_SECRET: test-session-secret
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --frozen --all-extras
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Run tests
        run: >-
          uv run pytest -q --tb=short --maxfail=15
          --ignore=tests/e2e
          --ignore=supplementaries/phase_4_guardrails
          --cov=eden
          --cov-report=term-missing:skip-covered
          --cov-fail-under=55
        # --maxfail=15 (not -x): path-org / LLM-router test drift should
        # surface a batch of failures per run instead of stopping at the
        # first, and coverage is computed over more of the suite.
        # tests/e2e requires the `playwright` Python package and the
        # playwright browser binary, neither of which is installed in
        # this CI image. The e2e suite is exercised on a separate
        # cron-scheduled workflow instead.
        # Coverage gate (55%) is set ~2pp below the 2026-07 baseline
        # (57%) so refactors don't fail CI on rounding; raise the
        # floor as coverage improves.

  build:
    name: docker build (Northflank shape)
    runs-on: ubuntu-latest
    needs: [lock-check, audit]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        # This is the same build Northflank runs. Catches Dockerfile
        # / uv.lock drift before the Northflank build does.
        run: docker buildx build --load -t eden-api:ci-test .
