name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Lint & Type Check (fast feedback — runs first)
  # ─────────────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system ruff mypy pydantic pydantic-settings fastapi asyncpg qdrant-client openai types-python-jose types-passlib

      - name: Run Ruff lint
        run: ruff check src/ tests/ --output-format=github

      - name: Run Ruff format check
        run: ruff format --check src/ tests/

      - name: Run MyPy type check
        run: mypy --config-file mypy.ini src/ tests/

  # ─────────────────────────────────────────────────────────────────────────
  # Unit & Integration Tests
  # ─────────────────────────────────────────────────────────────────────────
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck
    strategy:
      fail-fast: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eden_test
          POSTGRES_USER: eden_test
          POSTGRES_PASSWORD: eden_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: eden_test
      POSTGRES_USER: eden_test
      POSTGRES_PASSWORD: eden_test
      JWT_SECRET: test-jwt-secret-do-not-use-in-production-ever
      DEBUG: "true"
      CORS_ORIGINS: "*"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 && break
            sleep 1
          done

      - name: Run Alembic migrations (test DB)
        run: alembic upgrade head

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit -v --cov=src/eden --cov-report=xml --cov-report=term-missing -n auto

      - name: Run integration tests with coverage
        run: |
          pytest tests/integration -v --cov=src/eden --cov-append --cov-report=xml --cov-report=term-missing -n auto

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  # ─────────────────────────────────────────────────────────────────────────
  # Security Scan
  # ─────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install security tools
        run: |
          uv pip install --system bandit safety

      - name: Run Bandit (SAST)
        run: bandit -r src/ -f json -o bandit-report.json -ll

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

      - name: Run Safety (dependency CVE scan)
        run: safety scan --json || true

      - name: Run Semgrep (SAST)
        run: |
          uv pip install --system semgrep
          semgrep --config=auto --config=.semgrep/rules src/ --json --output=semgrep-report.json || true
        env:
          SEMGREP_SEND_METRICS: off

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 7

      - name: Run Semgrep custom rules (strict)
        run: |
          semgrep --config=.semgrep/strict src/ --json --output=semgrep-strict-report.json || true
        env:
          SEMGREP_SEND_METRICS: off

      - name: Upload Semgrep strict report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-strict-report
          path: semgrep-strict-report.json
          retention-days: 7

      - name: Run hallucinated dependency check
        run: |
          python -c "
from eden.evaluation.security_scanner import DependencyVerifier
import asyncio
verifier = DependencyVerifier()
# Parse requirements
with open('pyproject.toml') as f:
    content = f.read()
import re
deps = re.findall(r'\"([a-z][a-z0-9_-]+)', content)
async def check():
    result = await verifier.verify(deps)
    print(f'Dependencies checked: {result.metadata[\"packages_checked\"]}')
    print(f'Issues found: {len(result.issues)}')
    for issue in result.issues:
        print(f'  {issue.severity.value}: {issue.message}')
asyncio.run(check())
"

  # ─────────────────────────────────────────────────────────────────────────
  # Golden Dataset Validation
  # ─────────────────────────────────────────────────────────────────────────
  validate-golden-datasets:
    name: Validate Golden Datasets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Validate canonical golden dataset
        run: |
          python -c "
from eden.evaluation.golden_dataset import load_canonical_datasets
registry = load_canonical_datasets()
dataset = registry.get('gd_eden_canonical_v1')
assert dataset is not None, 'Canonical dataset not found'
assert len(dataset.cases) == 50, f'Expected 50 cases, got {len(dataset.cases)}'
errors = dataset.validate()
assert not errors, f'Dataset validation failed: {errors}'
print(f'Canonical dataset validated: {len(dataset.cases)} cases across {len({c.category for c in dataset.cases})} categories')
"

  # ─────────────────────────────────────────────────────────────────────────
  # E2E Tests (Playwright)
  # ─────────────────────────────────────────────────────────────────────────
  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-python

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eden_test
          POSTGRES_USER: eden_test
          POSTGRES_PASSWORD: eden_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: eden_test
      POSTGRES_USER: eden_test
      POSTGRES_PASSWORD: eden_test
      JWT_SECRET: test-jwt-secret-do-not-use-in-production-ever
      DEBUG: "true"
      CORS_ORIGINS: "*"
      OPENROUTER_API_KEY: test-api-key
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 && break
            sleep 1
          done

      - name: Run Alembic migrations (E2E DB)
        run: alembic upgrade head

      - name: Start backend server
        run: |
          set -e
          uvicorn eden.api.app:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          exit 1

      - name: Install Playwright
        run: |
          cd clients/portal
          npm ci
          npx playwright install --with-deps

      - name: Build Next.js app
        run: |
          cd clients/portal
          npm run build

      - name: Start frontend server
        run: |
          set -e
          cd clients/portal
          npm start &
          for i in {1..30}; do
            if curl -sf http://localhost:3000; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend failed to start"
          exit 1

      - name: Install pytest-playwright
        run: |
          uv pip install --system pytest-playwright

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -m e2e -v --headed=false

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: clients/portal/playwright-report/
          retention-days: 7
