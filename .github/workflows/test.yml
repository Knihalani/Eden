name: test

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run still going on the older one, which only
# spends minutes. Runs on main all finish: each one is a commit of main.
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Format, types and the CLI bundle, in parallel with the test shards below.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      # Formatting first, since it takes seconds: Prettier plus the line-length
      # check on the files under the formatter (scripts/format.sh).
      # `bun run format` fixes everything but long comments.
      - run: bun run format:check
      # Then typecheck: packages/* carry no build step, so tsc is the only
      # thing that ever looks at their types. Bun strips them unchecked.
      - run: bun run typecheck
      # The published CLI is a single-file bundle; a workspace dep or Bun API
      # that stops bundling must fail CI, not the first user's `npm i`.
      # EDEN_SKIP_CHECKS=1: build-cli would otherwise run typecheck and the
      # whole test suite again, which this workflow already runs.
      - run: bash scripts/build-cli.sh
        env:
          EDEN_SKIP_CHECKS: "1"

  # The suite in six parallel slices of its test files (EDEN_TEST_SHARD).
  # scripts/test-shard.ts deals the files out by their measured times
  # (scripts/test-times.txt), about 160 s of tests each. Slicing is by file,
  # so the slowest file sets the floor: benchmarks/campaign/edge.test.ts,
  # about 135 s.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      # Discovers every test directory instead of naming them. The previous
      # hardcoded list had drifted to a third of the suite, omitting every
      # package under active development.
      - run: bun run test
        env:
          EDEN_TEST_SHARD: ${{ matrix.shard }}/6
