name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      # Typecheck first: packages/* carry no build step, so tsc is the only
      # thing that ever looks at their types. Bun strips them unchecked.
      - run: bun run typecheck
      # Discovers every test directory instead of naming them. The previous
      # hardcoded list had drifted to a third of the suite, omitting every
      # package under active development.
      - run: bun run test
