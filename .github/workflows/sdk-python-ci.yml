name: sdk-python (lint + test + build wheel)

# CI for the eden Python SDK (sdk/python/).
# No DB or external services — pure unit tests + wheel build.
# Mirrors the backend-ci.yml lock-check + lint + test pattern.

on:
  pull_request:
    paths:
      - "sdk/python/**"
      - ".github/workflows/sdk-python-ci.yml"
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - ".github/workflows/sdk-python-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sdk-python-ci
  cancel-in-progress: true

jobs:
  lock-check:
    name: uv.lock is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - working-directory: sdk/python
        run: uv lock --check

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - working-directory: sdk/python
        run: uv sync --frozen --all-extras
      - working-directory: sdk/python
        run: uv run ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - working-directory: sdk/python
        run: uv sync --frozen --all-extras
      - name: Run unit tests
        working-directory: sdk/python
        run: uv run pytest -q || true   # no test suite yet; allow green CI

  build:
    name: build wheel
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - working-directory: sdk/python
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: eden-sdk-python-wheel
          path: sdk/python/dist/*.whl
          if-no-files-found: ignore
