name: portal (typecheck + build)

# CI for the Next.js portal. Catches the kind of type errors that
# were previously making it to production builds — e.g. pages
# calling API methods that don't exist on the client, route-group
# conflicts, missing types in @/lib/types.
#
# This does NOT deploy — Vercel handles the deploy via the GitHub
# integration. Its job is to be a red-light before the merge: any
# typecheck or build error here blocks the PR.
#
# Uses bun (matching vercel.json) because `package-lock.json` is
# not in sync with the lockfile that production installs from;
# running `npm ci` against an out-of-sync lockfile fails with
# EUSAGE. bun install --frozen-lockfile is what Vercel itself runs.

on:
  pull_request:
    paths:
      - "clients/portal/**"
      - ".github/workflows/portal-ci.yml"
  push:
    branches: [main]
    paths:
      - "clients/portal/**"
      - ".github/workflows/portal-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/portal

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
        env:
          # CI only needs to compile, not actually call the API.
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  unit-tests:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/portal
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  # Portal quality gates — anti-clutter / layout / class ratchets + polish
  # invariants. polish:check (scripts/polish-check.sh) already runs
  # lint:portal-layout, lint:portal-classes, and lint:portal-clutter as
  # steps, so one script run covers all four npm scripts. Pure static
  # analysis over src/ — no build or server needed, so this stays fast
  # and can't be skipped by a flaky server start. Ratchets only fail on
  # count INCREASES vs the stored baseline (see each script's header), so
  # this does not regress-flake on unrelated diffs.
  quality-gates:
    name: Portal quality gates (clutter/layout/classes/polish)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/portal
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run polish:check

  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    defaults:
      run:
        working-directory: clients/portal

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Ensure Clerk test keys when secrets absent
        run: |
          SK="${CLERK_SECRET_KEY:-sk_test_PXZfewH5OceW7H1BFN2mRSvkouyt0EgprOzjq0cBWm}"
          PK="${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_bW9kZXN0LWJ1Zy03LmNsZXJrLmFjY291bnRzLmRldiQ}"
          echo "CLERK_SECRET_KEY=$SK" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$PK" >> "$GITHUB_ENV"
          echo "CLERK_TEST_KEY_FALLBACK=1" >> "$GITHUB_ENV"
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      - run: bun run build
        env:
          # Production-parity client base: browser must hit same-origin /api/proxy
          # (not http://localhost:8000). Proxy upstream is API_INTERNAL_URL at runtime.
          NEXT_PUBLIC_API_URL: "/api/proxy"
          # NEXT_PUBLIC_* must be present at build time for Clerk JS to mount in production start.
          CLERK_SECRET_KEY: ${{ env.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      # K43 / P0-BUNDLE-CI — fail if any chunk >400KB or total >6MB.
      - name: Check bundle size budgets
        run: bun run check:bundle

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: portal-next-build-${{ github.run_id }}
          # .next is a hidden directory — upload-artifact@v4 skips hidden
          # paths unless include-hidden-files is true (otherwise a11y/golden
          # fail with "Artifact not found" after a successful build).
          path: |
            clients/portal/.next/**
            !clients/portal/.next/cache/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Upload .next for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.run_id }}
          path: |
            clients/portal/.next/**
            !clients/portal/.next/cache/**
          include-hidden-files: true
          retention-days: 3
          compression-level: 6

  # U20 axe gate — polls localhost after production build + start.
  # Runs authenticated (using Clerk testing token) so the real shell is audited.
  # Blocks main on critical violations (serious findings reported, non-blocking).
  a11y:
    name: Accessibility audit (U20 core routes)
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        working-directory: clients/portal
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: portal-next-build-${{ github.run_id }}
          path: clients/portal/.next
      - name: Ensure Clerk test keys when secrets absent
        run: |
          SK="${CLERK_SECRET_KEY:-sk_test_PXZfewH5OceW7H1BFN2mRSvkouyt0EgprOzjq0cBWm}"
          PK="${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_bW9kZXN0LWJ1Zy03LmNsZXJrLmFjY291bnRzLmRldiQ}"
          echo "CLERK_SECRET_KEY=$SK" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$PK" >> "$GITHUB_ENV"
          echo "CLERK_TEST_KEY_FALLBACK=1" >> "$GITHUB_ENV"
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      # Bind 0.0.0.0 so both localhost and 127.0.0.1 reach the server.
      # audit-a11y.cjs pings/navigates 127.0.0.1 — `-H localhost` rejects that on Linux.
      - name: Start portal
        env:
          API_INTERNAL_URL: "http://127.0.0.1:8000"
          CLERK_SECRET_KEY: ${{ env.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
          PORT: "3000"
        run: |
          bun run start -- -p 3000 -H 0.0.0.0 &
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:3000/" >/dev/null; then break; fi
            sleep 2
          done
          echo "Portal is up"
      - name: Seed Clerk auth state (headless)
        # Prefer GitHub Actions secrets; fall back to committed test-mode keys only
        # when neither secret is set. The fallback keys are TEST-mode credentials
        # for the modest-bug-7.clerk.accounts.dev instance — safe for CI.
        env:
          API_INTERNAL_URL: "http://127.0.0.1:8000"
          # Required: set CLERK_SECRET_KEY and NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          # as repository secrets for production-parity auth in CI.
          CLERK_SECRET_KEY: ${{ env.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # Must match audit-a11y host (127.0.0.1) so Clerk cookies apply.
          BASE_URL: "http://127.0.0.1:3000"
          PORT: "3000"
          NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
        run: |
          set -euo pipefail
          # seed-auth writes e2e/.auth-state.json used by audit:a11y.
          # Fails loudly if Clerk secrets are misconfigured — no silent unauthenticated pass.
          node e2e/golden/seed-auth.mjs
          if [[ ! -f e2e/.auth-state.json ]]; then
            echo "[a11y-ci] FATAL: seed-auth did not write e2e/.auth-state.json"
            exit 1
          fi
      - name: Run authenticated axe audit
        env:
          API_INTERNAL_URL: "http://127.0.0.1:8000"
          PORT: "3000"
          BASE_URL: "http://127.0.0.1:3000"
        run: bun run audit:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-reports-${{ github.run_id }}
          path: clients/portal/report-a11y-*.json
          retention-days: 7

  # F85 golden paths — 8 deep-assertion paths with real Clerk auth.
  # continue-on-error is intentionally REMOVED so this gates CI.
  # Auth seed failure exits non-zero (job fails). Path failures also exit 1
  # (GOLDEN_ALLOW_FAIL must never be set here — that soft-fails EXIT 0).
  # Required env: CLERK_SECRET_KEY, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
  # (repo secrets preferred; committed pk_test fallback via CLERK_TEST_KEY_FALLBACK).
  golden-paths:
    name: Golden paths (F85)
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        working-directory: clients/portal
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: portal-next-build-${{ github.run_id }}
          path: clients/portal/.next
      - name: Ensure Clerk test keys when secrets absent
        run: |
          SK="${CLERK_SECRET_KEY:-sk_test_PXZfewH5OceW7H1BFN2mRSvkouyt0EgprOzjq0cBWm}"
          PK="${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_bW9kZXN0LWJ1Zy03LmNsZXJrLmFjY291bnRzLmRldiQ}"
          echo "CLERK_SECRET_KEY=$SK" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$PK" >> "$GITHUB_ENV"
          echo "CLERK_TEST_KEY_FALLBACK=1" >> "$GITHUB_ENV"
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      - name: Start portal
        env:
          # Upstream for /api/proxy (backend may be down — proxy returns 502; shell still renders).
          API_INTERNAL_URL: "http://127.0.0.1:8000"
          CLERK_SECRET_KEY: ${{ env.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
          PORT: "3000"
        run: |
          # 0.0.0.0: accept both localhost and 127.0.0.1 (helpers/audit default to 127.0.0.1).
          bun run start -- -p 3000 -H 0.0.0.0 &
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:3000/" >/dev/null; then break; fi
            sleep 2
          done
          echo "Portal is up"
      - name: Seed Clerk auth state (headless)
        # Hard-fail when seed-auth exits non-zero or does not write storageState.
        # Do not soft-pass golden paths without usable auth.
        env:
          API_INTERNAL_URL: "http://127.0.0.1:8000"
          CLERK_SECRET_KEY: ${{ env.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # Keep host identical to helpers.mjs / audit-a11y defaults (127.0.0.1).
          BASE_URL: "http://127.0.0.1:3000"
          NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
          PORT: "3000"
        run: |
          set -euo pipefail
          node e2e/golden/seed-auth.mjs
          if [[ ! -f e2e/.auth-state.json ]]; then
            echo "[golden-ci] FATAL: seed-auth did not write e2e/.auth-state.json"
            echo "  Required env: CLERK_SECRET_KEY, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
            exit 1
          fi
      - name: Run golden paths (deep assertions)
        env:
          API_INTERNAL_URL: "http://127.0.0.1:8000"
          BASE_URL: "http://127.0.0.1:3000"
          NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
          GOLDEN_CI: "1"
          # Intentionally unset — GOLDEN_ALLOW_FAIL=1 would soft-exit 0 on path failures.
        run: node e2e/golden/golden-paths.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-screenshots-${{ github.run_id }}
          path: clients/portal/e2e/golden/screenshots
          retention-days: 7
