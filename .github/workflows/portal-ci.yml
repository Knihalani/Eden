name: portal (typecheck + build)

# CI for the Next.js portal. Catches the kind of type errors that
# were previously making it to production builds — e.g. pages
# calling API methods that don't exist on the client, route-group
# conflicts, missing types in @/lib/types.
#
# This does NOT deploy — Vercel handles the deploy via the GitHub
# integration. Its job is to be a red-light before the merge: any
# typecheck or build error here blocks the PR.
#
# Uses bun (matching vercel.json) because `package-lock.json` is
# not in sync with the lockfile that production installs from;
# running `npm ci` against an out-of-sync lockfile fails with
# EUSAGE. bun install --frozen-lockfile is what Vercel itself runs.

on:
  pull_request:
    paths:
      - "clients/portal/**"
      - ".github/workflows/portal-ci.yml"
  push:
    branches: [main]
    paths:
      - "clients/portal/**"
      - ".github/workflows/portal-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: portal-ci
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/portal

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
        env:
          # CI only needs to compile, not actually call the API.
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  unit-tests:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/portal
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    defaults:
      run:
        working-directory: clients/portal

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

      - name: Upload .next for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.run_id }}
          path: clients/portal/.next
          retention-days: 3

  # Soft a11y audit — needs a live portal server (scripts/audit-a11y.cjs
  # polls localhost). Non-blocking until the suite is green enough to
  # gate merges. continue-on-error keeps Phase 4 soft-launch CI green
  # even when axe reports serious/critical findings.
  a11y:
    name: Accessibility audit (soft)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [typecheck]
    defaults:
      run:
        working-directory: clients/portal
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Start portal + audit:a11y
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          PORT: "3000"
        run: |
          bun run build
          bun run start -- -p 3000 &
          # Wait for the server, then run axe. Soft job — failures don't block.
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:3000/" >/dev/null; then
              break
            fi
            sleep 2
          done
          bun run audit:a11y || true
