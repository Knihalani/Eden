name: portal (typecheck + build)

# CI for the Next.js portal. Catches the kind of type errors that
# were previously making it to production builds — e.g. pages
# calling API methods that don't exist on the client, route-group
# conflicts, missing types in @/lib/types.
#
# This does NOT deploy — Vercel handles the deploy via the GitHub
# integration. Its job is to be a red-light before the merge: any
# typecheck or build error here blocks the PR.

on:
  pull_request:
    paths:
      - "clients/portal/**"
      - ".github/workflows/portal-ci.yml"
  push:
    branches: [main]
    paths:
      - "clients/portal/**"
      - ".github/workflows/portal-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: portal-ci
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/portal

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/portal/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
        env:
          # CI only needs to compile, not actually call the API.
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    needs: typecheck
    defaults:
      run:
        working-directory: clients/portal

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/portal/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

      - name: Upload .next for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.run_id }}
          path: clients/portal/.next
          retention-days: 3
