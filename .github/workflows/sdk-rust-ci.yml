name: sdk-rust (lint + test + build)

# CI for the eden Rust SDK (sdk/rust/).
# Runs cargo fmt --check + cargo clippy + cargo test + cargo build.

on:
  pull_request:
    paths:
      - "sdk/rust/**"
      - ".github/workflows/sdk-rust-ci.yml"
  push:
    branches: [main]
    paths:
      - "sdk/rust/**"
      - ".github/workflows/sdk-rust-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sdk-rust-ci
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - working-directory: sdk/rust
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust -> target
      - working-directory: sdk/rust
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust -> target
      - working-directory: sdk/rust
        run: cargo test --all
