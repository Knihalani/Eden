[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_ignores = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_configs = True
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

# FastAPI route handlers often return Pydantic models / `dict[str, Any]`
# whose precise shape depends on response_model. Requiring explicit
# annotations on every handler creates churn without safety gain.
# We still check body / query / response model *types* via Pydantic.
[mypy-eden.api.routes.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

# SDK stub modules mirror external API shapes; their bodies are
# skeletons only.
[mypy-eden.sdk.community_stubs]
disallow_untyped_defs = False
[mypy-eden.sdk.ide_stubs]
disallow_untyped_defs = False

# Adversarial probe modules return arbitrary-shaped dicts; the
# important thing is the *executed side effects*.
[mypy-eden.kb.exploit.probes.*]
disallow_untyped_defs = False

# Replay / step-edit DSL helpers — public surface returns
# heterogeneous envelopes (`{"ok": True, ...}` vs `{"ok": False, "error": ...}`).
[mypy-eden.time_travel.*]
disallow_untyped_defs = False

# ─────────────────────────────────────────────────────────────────────────
# Below: modules where the dynamic / external types outpace the value of
# tightening. These are NOT a license to ignore every error — only the
# `disallow_untyped_defs` knob is relaxed (mypy still reports other
# errors like arg-type, attr-defined, etc.).
# ─────────────────────────────────────────────────────────────────────────

# LLM judge modules parse dynamic JSON returned by OpenAI / Anthropic;
# `_extract_*` helpers receive an untyped `event` argument and a tuple
# of heterogeneous fields, neither of which adds value to retype here.
[mypy-eden.llmops.judges.*]
disallow_untyped_defs = False

# Auth / RBAC middleware operates on a free-form `user: dict` and a
# permission matrix that's maintained out-of-band.
[mypy-eden.api.routes.rbac]
disallow_untyped_defs = False
[mypy-eden.api.middleware.*]
disallow_untyped_defs = False

# sim_runner orchestrates the Agent → Sim subprocess boundary; the
# runtime type information depends on which sandbox adapter was bound.
[mypy-eden.sim_runner]
disallow_untyped_defs = False

# Multi-agent planning has a plugin-shaped registry of environments,
# each with its own private lifecycle hooks.
[mypy-eden.multi_agent.planning]
disallow_untyped_defs = False

# Kafka consumer is mostly a stateful sink over a heterogeneous stream.
[mypy-eden.realtime.kafka_consumer]
disallow_untyped_defs = False
[mypy-eden.realtime.grpc_server]
disallow_untyped_defs = False
[mypy-eden.realtime.mobile_sse]
disallow_untyped_defs = False

# Storage helpers wrap a connection pool whose record shape depends on
# the SQL query that produced it.
[mypy-eden.storage.redis]
disallow_untyped_defs = False
[mypy-eden.storage.postgres]
disallow_untyped_defs = False

# Data-platform contract validators operate on Pydantic models that
# themselves wrap dynamic JSON-schema inputs.
[mypy-eden.data_platform.contracts]
disallow_untyped_defs = False

# APM-depth intelligence routes are FastAPI wrappers over analytics
# services that return `dict[str, Any]` envelopes.
[mypy-eden.api.routes.intelligence_apm_depth]
disallow_untyped_defs = False

# Experiment recommender returns a heterogeneous recommendation
# (ship / don't_ship / need_more_data) with payload-specific shape.
[mypy-eden.experiments.experiment_intel.recommender]
disallow_untyped_defs = False

# Decision DSL envelope helpers.
[mypy-eden.decision._common]
disallow_untyped_defs = False
