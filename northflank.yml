# =============================================================================
# Eden — Northflank deployment manifest (Developer Sandbox / free tier)
# =============================================================================
#
# Northflank free "Developer Sandbox" plan allocations:
#   • 2 services (long-running containers with public ingress)
#   • 2 jobs   (long-running workers + scheduled cron)
#   • 1 addon  (managed Postgres / Redis / MongoDB / etc.)
#   • 1 BYOC cluster allowed (we don't use it on the free tier)
#
# Stack fit (matches live Northflank project eden-staging-us-central):
#   • eden-api       → service   (FastAPI — runs Alembic on boot, /live + /ready)
#   • eden-worker    → job       (background loops + multi-tenant maintenance)
#   • eden-cron      → job       (DISABLED no-op — kept only to fill free-tier slot;
#                                all scheduled work runs on eden-worker)
# No eden-migrate job — keeps the 2-job quota; API lifespan runs Alembic before /ready.
#
# External / out-of-sandbox (free tiers elsewhere):
#   • Qdrant         → Qdrant Cloud free (1 GB cluster) — set QDRANT_HOST
#   • Redis          → Upstash free (10k cmds/day) — set REDIS_URL
#   • Tinybird       → already used by Cat 18 — no change
#
# Deploy from CLI (one-time):
#   1. npm i -g @northflank/cli
#   2. northflank login
#   3. northflank create project --name eden-staging
#   4. northflank combine --project eden-staging --path ./northflank.yml
#
# Or from the dashboard: New → Import Manifest → paste this file.
#
# After first deploy:
#   • Note the API service URL (e.g. https://eden-api--<id>.northflank.app)
#   • Set NEXT_PUBLIC_API_URL on Vercel to that URL
#   • Set CORS_ORIGINS_RAW to the Vercel portal URL
# =============================================================================

apiVersion: defaults/v1
kind: Project
metadata:
  name: eden-staging-us-central
  description: Eden AI-native environment generation platform - staging
spec:
  # us-central is the only region that supports free-tier projects on
  # this account. Vercel deploys to iad1 by default — there's a ~70ms
  # inter-region hop but it's negligible for staging.
  region: us-central

  # ── Secrets to be set via the Northflank dashboard or
  #    `northflank create secret` BEFORE applying this manifest. Names
  #    below must match. Values come from `.env` locally or your secret
  #    manager. Do NOT commit them to git.
  secretGroups:
    - name: eden-required
      description: |
        Required secrets for the API + worker. Generate the first three
        with `python scripts/secrets_generate.py`. The rest come from
        the corresponding vendor dashboards.
      secrets:
        - name: JWT_SECRET
        - name: ENCRYPTION_KEY
        - name: SESSION_SECRET
        - name: OPENROUTER_API_KEY
        - name: TINYBIRD_ADMIN_TOKEN
        - name: TINYBIRD_BRANCH_TOKEN
        - name: SENTRY_DSN
        # Optional. An empty / malformed value used to crash the API at
        # import time (BadDsn: Unsupported scheme ''). ``_init_sentry``
        # now skips invalid DSNs so the pod can boot; leave empty or set
        # a full https://…@….ingest.sentry.io/… DSN.
        - name: GITHUB_APP_ID
        - name: GITHUB_APP_CLIENT_ID
        - name: GITHUB_APP_CLIENT_SECRET
        - name: GITHUB_APP_PRIVATE_KEY
        - name: GITHUB_APP_WEBHOOK_SECRET
        - name: GITHUB_APP_CALLBACK_URL
        # SendKit transactional + sparse alert email (never commit the key).
        - name: SENDKIT_API_KEY
        - name: REDIS_URL
        - name: UPSTASH_REDIS_REST_URL
        - name: UPSTASH_REDIS_REST_TOKEN
        - name: QDRANT_API_KEY
        # ── Clerk (auth + webhooks) ────────────────────────────────
        # CLERK_SECRET_KEY verifies Clerk session JWTs forwarded by
        # the portal's /api/proxy. CLERK_PUBLISHABLE_KEY is public-
        # by-design and intentionally NOT in this secret group — see
        # the eden-api env block where it's a plain value (rotation
        # is a no-op since it's already public). CLERK_WEBHOOK_SIGNING_SECRET
        # verifies Svix webhook signatures — missing means Clerk webhooks
        # (user create, org membership change) silently fail at the API.
        # METRICS_BEARER_TOKEN gates the /metrics endpoint — empty
        # means scrapers get 503 (intentional, see
        # src/eden/observability/metrics_endpoint.py).
        - name: CLERK_SECRET_KEY
        - name: CLERK_WEBHOOK_SIGNING_SECRET
        - name: METRICS_BEARER_TOKEN
        # ── Postgres (Neon cutover, Phase 7) ────────────────────────
        # All five POSTGRES_* vars come from the eden-required secret
        # group. The values point at a Neon Scale project in us-east-2
        # (Ohio). POSTGRES_SSLMODE=require is mandatory — Neon rejects
        # unencrypted connections. See docs/deploy/neon-cutover.md for
        # the cutover runbook.
        - name: POSTGRES_HOST
        - name: POSTGRES_PORT
        - name: POSTGRES_DB
        - name: POSTGRES_USER
        - name: POSTGRES_PASSWORD
        - name: POSTGRES_SSLMODE
        - name: POSTGRES_CHANNEL_BINDING
        - name: POSTGRES_ENDPOINT_ID

# ─────────────────────────────────────────────────────────────────────
# Service 1/2: eden-api (FastAPI)
# ─────────────────────────────────────────────────────────────────────
---
apiVersion: workloads/v1
kind: Service
metadata:
  name: eden-api
spec:
  # Free-tier preset: 0.2 vCPU, 512 MB RAM. Bump to nf-compute-50 or
  # nf-compute-100-2 for production. Sandbox plan caps at nf-compute-20.
  compute:
    name: nf-compute-20
  deployment:
    instances: 1
  build:
    type: dockerfile
    dockerfilePath: ./Dockerfile
    dockerBuildContext: .
  ports:
    - name: http
      port: 8000
      type: http
  healthCheck:
    type: http
    httpPath: /ready
    intervalSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  # Northflank forwards SIGTERM and gives 30s for graceful drain, which
  # matches what bin/serve.sh and the Dockerfile's STOPSIGNAL expect.
  terminationGracePeriodSeconds: 30
  env:
    # ── App defaults ──────────────────────────────────────────────
    - name: APP_NAME
      value: Eden
    - name: APP_VERSION
      value: 0.1.0
    - name: DEBUG
      value: "false"
    - name: HOST
      value: 0.0.0.0
    - name: PORT
      value: "8000"
    - name: LOG_LEVEL
      value: INFO
    - name: LOG_JSON
      value: "true"
    - name: EDEN_PRODUCTION
      value: "1"
    - name: EDEN_MIGRATIONS_DIR
      value: /app/migrations
    - name: EDEN_RUN_BACKGROUND_WORKERS
      value: "0"
    - name: SENTRY_ENVIRONMENT
      value: production
    - name: SENTRY_TRACES_SAMPLE_RATE
      value: "0.1"
    # ── CORS — set this to your Vercel portal URL after first deploy ──
    # Comma-separated, no wildcards. Examples:
    #   https://eden-portal.vercel.app,https://edenobservability.com
    - name: CORS_ORIGINS_RAW
      value: https://edenobservability.com
    # ── Postgres (Neon cutover, Phase 7) ────────────────────────
    # All POSTGRES_* values are resolved from the eden-required secret
    # group. POSTGRES_SSLMODE must be "require" (or stricter) — Neon
    # rejects plain-text connections. See docs/deploy/neon-cutover.md.
    - name: POSTGRES_HOST
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_HOST } }
    - name: POSTGRES_PORT
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_PORT } }
    - name: POSTGRES_DB
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_DB } }
    - name: POSTGRES_USER
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_USER } }
    - name: POSTGRES_PASSWORD
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_PASSWORD } }
    - name: POSTGRES_SSLMODE
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_SSLMODE } }
    - name: POSTGRES_CHANNEL_BINDING
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_CHANNEL_BINDING } }
    - name: POSTGRES_ENDPOINT_ID
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_ENDPOINT_ID } }
    - name: POSTGRES_POOL_SIZE
      value: "10"            # 512 MB container — cap pool aggressively
    - name: POSTGRES_MIN_POOL_SIZE
      value: "0"            # empty pool → Neon can scale to zero
    - name: POSTGRES_MAX_INACTIVE_CONNECTION_LIFETIME
      value: "30"           # drop idle sockets well under Neon suspend (~300s)
    - name: POSTGRES_STATEMENT_TIMEOUT_MS
      value: "30000"
    # ── Qdrant (external — Qdrant Cloud free tier) ──────────────
    # Hostname only — NOT a full URL. qdrant.py builds https://{host}:{port}
    # when QDRANT_HTTPS=true (required for Qdrant Cloud).
    - name: QDRANT_HOST
      value: 58384b79-0261-480e-b61f-d86bbf1c0dad.us-east4-0.gcp.cloud.qdrant.io
    - name: QDRANT_HTTPS
      value: "true"
    - name: QDRANT_PORT
      value: "6333"
    - name: QDRANT_COLLECTION_PREFIX
      value: eden_
    - name: QDRANT_API_KEY
      valueFrom: { secretKeyRef: { group: eden-required, key: QDRANT_API_KEY } }
    # ── Redis (external — Upstash free tier) ────────────────────
    # Conserve commands: rate limits stay in-process (single replica),
    # redis-py health PINGs disabled. Set RATE_LIMIT_DISTRIBUTED=true
    # only after upgrading Upstash past Free (10k cmds/day).
    - name: REDIS_URL
      valueFrom: { secretKeyRef: { group: eden-required, key: REDIS_URL } }
    - name: RATE_LIMIT_DISTRIBUTED
      value: "false"
    - name: REDIS_HEALTH_CHECK_INTERVAL
      value: "0"
    # Long XREADGROUP block + rare XAUTOCLAIM — Upstash Free is 10k cmds/day.
    - name: REDIS_STREAM_BLOCK_MS
      value: "300000"
    - name: REDIS_STREAM_AUTOCLAIM_INTERVAL_S
      value: "300"
    - name: REDIS_LEADER_TICK_SECONDS
      value: "120"
    # Traffic-path Redis: skip per-span streams + idle SSE/live writes.
    - name: REDIS_TELEMETRY_STREAM_ENABLED
      value: "false"
    - name: REDIS_SSE_WRITE_WHEN_IDLE
      value: "false"
    - name: REDIS_LIVE_WRITE_WHEN_IDLE
      value: "false"
    # ── Tinybird (Cat 18 columnar) — already external ───────────
    - name: CLICKHOUSE_URL
      value: https://api.us-east.tinybird.co
    - name: CLICKHOUSE_DATABASE
      value: eden
    - name: CLICKHOUSE_TIMEOUT
      value: "30"
    - name: TINYBIRD_API_HOST
      value: https://api.us-east.tinybird.co
    # ── LLM (defaults; OPENROUTER_API_KEY is a secret) ──────────
    - name: OPENROUTER_BASE_URL
      value: https://openrouter.ai/api/v1
    - name: MINIMAX_BASE_URL
      value: https://api.minimax.io/v1
    - name: MINIMAX_MODEL
      value: MiniMax-M3
    - name: USE_MINIMAX
      value: "false"
    # ── Sandbox limits (tight on free tier) ─────────────────────
    - name: SANDBOX_MEMORY_MB
      value: "256"
    - name: SANDBOX_CPU_COUNT
      value: "1"
    - name: SANDBOX_SNAPSHOT_POOL_SIZE
      value: "5"
    - name: SANDBOX_MAX_CONCURRENT
      value: "10"
    # ── Typesense (full-text search) — W9: enable when TYPESENSE_HOST
    # secret is provisioned. Set TYPESENSE_ENABLED=true and wire host/key
    # from Northflank secrets (do not use localhost).
    - name: TYPESENSE_ENABLED
      value: "true"
    - name: TYPESENSE_HOST
      valueFrom: { secretKeyRef: { group: eden-required, key: TYPESENSE_HOST, optional: true } }
    - name: TYPESENSE_API_KEY
      valueFrom: { secretKeyRef: { group: eden-required, key: TYPESENSE_API_KEY, optional: true } }
    # ── Pipeline / observability defaults ───────────────────────
    - name: PIPELINE_TIMEOUT_SECONDS
      value: "300"
    - name: PIPELINE_TIMEOUT_ENABLED
      value: "true"
    - name: BRONZE_BATCH_SIZE
      value: "100"
    - name: BRONZE_FLUSH_INTERVAL_SECONDS
      value: "5.0"
    - name: RATE_LIMIT_DEFAULT_PER_WINDOW
      value: "60"
    - name: RATE_LIMIT_WINDOW_SECONDS
      value: "60"
    - name: EVOLVER_AUTO_CANARY_PCT
      value: "5"
    # ── Token budgets (defaults from .env.example) ──────────────
    - name: MAX_TOKENS_PLANNER
      value: "50000"
    - name: MAX_TOKENS_CRITIC
      value: "30000"
    - name: MAX_TOKENS_REFINER
      value: "25000"
    - name: MAX_TOKENS_FACT_CHECKER
      value: "25000"
    - name: MAX_TOKENS_EXECUTOR
      value: "15000"
    - name: MAX_TOKENS_CODE_QUALITY
      value: "10000"
    - name: MAX_TOKENS_VERIFIER
      value: "10000"
    - name: MAX_TOKENS_TESTER
      value: "10000"
    - name: MAX_TOKENS_ARCHIVIST
      value: "60000"
    # ── Secrets (from the secretGroup above) ────────────────────
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: JWT_SECRET
    - name: ENCRYPTION_KEY
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: ENCRYPTION_KEY
    - name: SESSION_SECRET
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: SESSION_SECRET
    # ── Clerk (portal auth provider, June 2026 cutover) ────────
    # CLERK_SECRET_KEY is the live secret key for the Clerk instance
    # hosting the portal — must be the SAME value as the one set on
    # Vercel for the portal (NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is
    # paired with this key). Without it the FastAPI side of the auth
    # chain can't verify Clerk session JWTs forwarded by the portal's
    # /api/proxy catch-all route.
    # CLERK_JWKS_URL is the public-key endpoint for that instance.
    # CLERK_PUBLISHABLE_KEY is the client-side key (intentionally
    # public) — only used here to auto-derive the JWKS URL when
    # CLERK_JWKS_URL is empty.
    - name: CLERK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: CLERK_SECRET_KEY
    - name: CLERK_PUBLISHABLE_KEY
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: CLERK_PUBLISHABLE_KEY
    - name: CLERK_JWKS_URL
      value: https://clerk.edenobservability.com/.well-known/jwks.json
    - name: CLERK_WEBHOOK_SIGNING_SECRET
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: CLERK_WEBHOOK_SIGNING_SECRET
    - name: METRICS_BEARER_TOKEN
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: METRICS_BEARER_TOKEN
    - name: OPENROUTER_API_KEY
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: OPENROUTER_API_KEY
    - name: TINYBIRD_ADMIN_TOKEN
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: TINYBIRD_ADMIN_TOKEN
    - name: TINYBIRD_BRANCH_TOKEN
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: TINYBIRD_BRANCH_TOKEN
    - name: SENTRY_DSN
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: SENTRY_DSN
    - name: GITHUB_APP_ID
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: GITHUB_APP_ID
    - name: GITHUB_APP_CLIENT_ID
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: GITHUB_APP_CLIENT_ID
    - name: GITHUB_APP_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: GITHUB_APP_CLIENT_SECRET
    - name: GITHUB_APP_PRIVATE_KEY
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: GITHUB_APP_PRIVATE_KEY
    - name: GITHUB_APP_WEBHOOK_SECRET
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: GITHUB_APP_WEBHOOK_SECRET
    - name: GITHUB_APP_CALLBACK_URL
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: GITHUB_APP_CALLBACK_URL
    - name: SENDKIT_API_KEY
      valueFrom:
        secretKeyRef:
          group: eden-required
          key: SENDKIT_API_KEY
    # Public URL slug (github.com/apps/<slug>) — NOT the OAuth client id.
    # Plain value so missing secret groups don't break the deploy; code
    # also defaults to eden-observability when unset.
    - name: GITHUB_APP_SLUG
      value: eden-observability
    # ── N23 recurring improvement agent (July 2026 bloat-cut ship) ──
    - name: IMPROVEMENT_AGENT_V1
      value: "true"
    - name: IMPROVEMENT_SCHEDULE_ENABLED
      value: "true"

# ─────────────────────────────────────────────────────────────────────
# Job 1/2: eden-worker (long-running background work)
# ─────────────────────────────────────────────────────────────────────
---
apiVersion: workloads/v1
kind: Job
metadata:
  name: eden-worker
spec:
  # nf-compute-20 (0.2 vCPU / 512 MB) is the current sandbox-safe
  # setting — the Developer Sandbox plan caps compute at nf-compute-20,
  # so this matches eden-api. Bump to nf-compute-100-2 (or higher) for
  # production once off the free tier; Cat 14 autonomous jobs + Cat 9
  # user-intel batch processing will want the extra headroom then.
  compute:
    name: nf-compute-20
  deployment:
    instances: 1
  # 2026-07-29 — the worker had not written a heartbeat in 7.4 days.
  # Two failure modes, both structural rather than code:
  #
  #  1. ``backoffLimit: 0`` meant a crashed run was simply gone. Between
  #     2026-07-21 and 07-24 forty-five consecutive runs failed and
  #     nothing ever restarted them, so every background loop
  #     (maintenance, insights, EQL watchdog, webhook drain, self-obs,
  #     quality pipeline, trace-finalized consumer) was dead in prod
  #     while the API happily served reads.
  #  2. Nothing stopped runs stacking: each deploy started another and
  #     left the previous one behind, so five were "RUNNING" at once —
  #     five idle pollers all billing Upstash and Neon for one job's
  #     worth of work.
  #
  # ``backoffLimit`` is the API's own field (GET .../jobs/eden-worker →
  # ``settings.backoffLimit``, verified 2026-07-29) and makes a crashed
  # run retry instead of vanishing.
  #
  # Run stacking is NOT fixed here. The job also carries
  # ``settings.runOnSourceChange: cd-promote``, so every deploy starts a
  # fresh run and leaves the previous one behind. Northflank exposes no
  # concurrency policy for manual jobs, so the durable fix is to stop
  # old runs on deploy (or move the worker to a service once off the
  # Developer Sandbox, which caps this project at one service). Until
  # then, check for stacked runs after each deploy:
  #   GET /v1/projects/eden-staging-us-central/jobs/eden-worker/runs
  # and abort any with status RUNNING older than the newest.
  settings:
    backoffLimit: 3
  build:
    type: dockerfile
    dockerfilePath: ./Dockerfile
    dockerBuildContext: .
  # The worker is a long-running service that never accepts HTTP.
  # SKIP_MIGRATIONS=1 — API runs Alembic on boot; worker must not race migrations.
  # Override the default CMD via the start command. We exec into the
  # same image with a different command that runs the worker loop.
  command:
    - bash
    - -lc
    - |
      cd /app
      export SKIP_MIGRATIONS=1
      exec python -m eden.workers.main
  env:
    - name: APP_NAME
      value: Eden
    - name: APP_VERSION
      value: 0.1.0
    - name: DEBUG
      value: "false"
    - name: LOG_LEVEL
      value: INFO
    - name: LOG_JSON
      value: "true"
    # Dedicated worker hosts background loops; API keeps this at "0".
    - name: EDEN_RUN_BACKGROUND_WORKERS
      value: "1"
    - name: SENTRY_ENVIRONMENT
      value: northflank-staging-worker
    - name: POSTGRES_HOST
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_HOST } }
    - name: POSTGRES_PORT
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_PORT } }
    - name: POSTGRES_DB
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_DB } }
    - name: POSTGRES_USER
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_USER } }
    - name: POSTGRES_PASSWORD
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_PASSWORD } }
    - name: POSTGRES_SSLMODE
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_SSLMODE } }
    - name: POSTGRES_CHANNEL_BINDING
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_CHANNEL_BINDING } }
    - name: POSTGRES_ENDPOINT_ID
      valueFrom: { secretKeyRef: { group: eden-required, key: POSTGRES_ENDPOINT_ID } }
    # Pool must cover the largest sidecar's own concurrency plus
    # headroom for the 5 leader-gated loops this process hosts, not
    # just "a worker" — quality_pipeline runs up to 8 concurrent
    # judges (concurrency=8, src/eden/observability/quality_pipeline/
    # worker.py), trace_finalized_consumer runs up to 5 concurrent
    # scans (_MAX_CONCURRENT_SCANS=5, src/eden/workers/
    # trace_finalized_consumer.py) — either alone can saturate a pool
    # of 5. 15 = 8 (larger sidecar) + 5 (one conn/leader-gated loop)
    # + a couple spare, still modest for a nf-compute-20 container.
    - name: POSTGRES_POOL_SIZE
      value: "15"
    - name: POSTGRES_MIN_POOL_SIZE
      value: "0"
    - name: POSTGRES_MAX_INACTIVE_CONNECTION_LIFETIME
      value: "30"           # drop idle sockets well under Neon suspend (~300s)
    - name: QDRANT_HOST
      value: 58384b79-0261-480e-b61f-d86bbf1c0dad.us-east4-0.gcp.cloud.qdrant.io
    - name: QDRANT_HTTPS
      value: "true"
    - name: QDRANT_PORT
      value: "6333"
    - name: QDRANT_API_KEY
      valueFrom: { secretKeyRef: { group: eden-required, key: QDRANT_API_KEY } }






    - name: REDIS_URL
      valueFrom: { secretKeyRef: { group: eden-required, key: REDIS_URL } }
    - name: RATE_LIMIT_DISTRIBUTED
      value: "false"
    - name: REDIS_HEALTH_CHECK_INTERVAL
      value: "0"
    # Long XREADGROUP block + rare XAUTOCLAIM — Upstash Free is 10k cmds/day.
    - name: REDIS_STREAM_BLOCK_MS
      value: "300000"
    - name: REDIS_STREAM_AUTOCLAIM_INTERVAL_S
      value: "300"
    - name: REDIS_LEADER_TICK_SECONDS
      value: "120"
    - name: REDIS_TELEMETRY_STREAM_ENABLED
      value: "false"
    - name: REDIS_SSE_WRITE_WHEN_IDLE
      value: "false"
    - name: REDIS_LIVE_WRITE_WHEN_IDLE
      value: "false"
    - name: CLICKHOUSE_URL
      value: https://api.us-east.tinybird.co
    - name: CLICKHOUSE_DATABASE
      value: eden
    - name: TINYBIRD_API_HOST
      value: https://api.us-east.tinybird.co
    - name: OPENROUTER_BASE_URL
      value: https://openrouter.ai/api/v1
    - name: JWT_SECRET
      valueFrom: { secretKeyRef: { group: eden-required, key: JWT_SECRET } }
    - name: ENCRYPTION_KEY
      valueFrom: { secretKeyRef: { group: eden-required, key: ENCRYPTION_KEY } }
    - name: SESSION_SECRET
      valueFrom: { secretKeyRef: { group: eden-required, key: SESSION_SECRET } }
    - name: OPENROUTER_API_KEY
      valueFrom: { secretKeyRef: { group: eden-required, key: OPENROUTER_API_KEY } }
    - name: TINYBIRD_ADMIN_TOKEN
      valueFrom: { secretKeyRef: { group: eden-required, key: TINYBIRD_ADMIN_TOKEN } }
    - name: TINYBIRD_BRANCH_TOKEN
      valueFrom: { secretKeyRef: { group: eden-required, key: TINYBIRD_BRANCH_TOKEN } }
    - name: SENTRY_DSN
      valueFrom: { secretKeyRef: { group: eden-required, key: SENTRY_DSN } }
    # ── Clerk (Phase 2 audit — workers need it for Cat 14 autonomous
    # actions + future webhook verification in jobs). Without these
    # the worker would have no way to call Clerk on behalf of the
    # user when e.g. posting a Slack notification via Clerk's user
    # lookup, or when re-verifying a webhook signature mid-job.
    - name: CLERK_SECRET_KEY
      valueFrom: { secretKeyRef: { group: eden-required, key: CLERK_SECRET_KEY } }
    - name: CLERK_PUBLISHABLE_KEY
      valueFrom: { secretKeyRef: { group: eden-required, key: CLERK_PUBLISHABLE_KEY } }
    - name: CLERK_WEBHOOK_SIGNING_SECRET
      valueFrom: { secretKeyRef: { group: eden-required, key: CLERK_WEBHOOK_SIGNING_SECRET } }

# ─────────────────────────────────────────────────────────────────────
# Job 2/2: eden-cron (DISABLED — maintenance lives on eden-worker)
# Kept as a free-tier job slot placeholder. Command is a no-op so a
# stray schedule fire cannot duplicate run_maintenance_due / wake Neon.
# Improvement sweeps stay off (issue-driven drafts only).
# ─────────────────────────────────────────────────────────────────────
---
apiVersion: workloads/v1
kind: Job
metadata:
  name: eden-cron
spec:
  # Smallest compute — this job never does real work.
  compute:
    name: nf-compute-10
  build:
    type: dockerfile
    dockerfilePath: ./Dockerfile
    dockerBuildContext: .
  # Rare schedule + no-op command. Prefer suspending the schedule
  # in the Northflank dashboard after apply.
  schedule:
    cronExpression: "0 0 1 1 *"
    timezone: UTC
  command:
    - bash
    - -lc
    - |
      echo "eden-cron disabled: maintenance + EQL + demotion run on eden-worker"
      exit 0
  # This job's command never imports eden code and never reads any env
  # var — it's a static echo + exit 0. Trimmed to the handful of plain
  # (non-secret) values useful for log/console context; the full
  # production secret set (Postgres, Redis, JWT/Encryption/Session,
  # OpenRouter, Clerk) previously wired here was dead weight that only
  # widened the blast radius of a leaked/misconfigured secret for a
  # job that should never run real code.
  env:
    - name: APP_NAME
      value: Eden
    - name: DEBUG
      value: "false"
    - name: LOG_LEVEL
      value: INFO
    - name: LOG_JSON
      value: "true"
    - name: SENTRY_ENVIRONMENT
      value: northflank-staging-cron


# ─────────────────────────────────────────────────────────────────────
# No Postgres addon — the database lives on Neon Scale
# ─────────────────────────────────────────────────────────────────────
# The previous eden-postgres addon was the source of the
# ``externalAccessEnabled`` blocker: the Northflank API doesn't expose
# the internal hostname for sandbox addons, and ``externalAccessEnabled:
# true`` patches silently no-op. We migrated to Neon Scale (Phase 7 of
# the Postgres + Compression plan); see docs/deploy/neon-cutover.md.
# All POSTGRES_* values are now resolved from the eden-required secret
# group, which the operator populates with the Neon connection details
# during the cutover runbook.
