[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eden-sdk"
version = "0.2.19"
description = "Eden runtime SDK — auto-instrumentation, tracing, and fire-and-forget telemetry for LLM applications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Eden", email = "hello@eden.dev" },
]
keywords = ["llm", "observability", "tracing", "openai", "anthropic", "langchain", "agent", "eden"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # httpx is the only required runtime dep — the SDK is a fire-and-forget
    # telemetry sender that doesn't need pydantic/dataclasses-json/etc.
    # Earlier versions declared pydantic as a dep "in case a future
    # release uses it" but no SDK code actually imports it. Removing it
    # slashes the installed footprint (pydantic pulls in a sizeable dep
    # tree including annotated-types, typing-extensions, and email-validator
    # transitively). Users who want pydantic models in their own code
    # can install it separately — the SDK doesn't depend on it.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Provider instrumentations
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
langchain = ["langchain-core>=0.2"]
llama_index = ["llama-index-core>=0.10"]
crewai = ["crewai>=0.50"]
autogen = ["pyautogen>=0.2"]
mastra = []
# Convenience meta-extras
all = [
    "openai>=1.30",
    "anthropic>=0.30",
    "langchain-core>=0.2",
    "llama-index-core>=0.10",
    "crewai>=0.50",
    "pyautogen>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.8",
    "respx>=0.21",
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://eden.dev"
Documentation = "https://docs.eden.dev/sdk/python"
Repository = "https://github.com/eden-ai/eden"
Issues = "https://github.com/eden-ai/eden/issues"

[tool.setuptools]
package-dir = { "" = "." }
packages = ["eden", "eden_sdk", "eden_sdk.instrumentations"]

[tool.setuptools.package-data]
eden = ["py.typed"]
eden_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
markers = [
    "perf: performance / overhead benchmarks",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
