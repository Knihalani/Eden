[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eden-sdk"
version = "0.4.2"
description = "Eden runtime SDK — auto-instrumentation, tracing, and fire-and-forget telemetry for LLM applications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Eden", email = "hello@eden.dev" },
]
keywords = ["llm", "observability", "tracing", "openai", "anthropic", "langchain", "agent", "eden"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # httpx is the only required runtime dep — the SDK is a fire-and-forget
    # telemetry sender that doesn't need pydantic/dataclasses-json/etc.
    # Earlier versions declared pydantic as a dep "in case a future
    # release uses it" but no SDK code actually imports it. Removing it
    # slashes the installed footprint (pydantic pulls in a sizeable dep
    # tree including annotated-types, typing-extensions, and email-validator
    # transitively). Users who want pydantic models in their own code
    # can install it separately — the SDK doesn't depend on it.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Wire-path speed: orjson makes the send hot path ~6.7× faster on the
# serialization step and zstd (N2) makes the compressed wire ~3.8× faster
# than gzip-1 at the same ratio. Kept optional so the base install stays
# minimal; ``_fast_json`` and ``_wire_compress`` fall back with identical
# bytes when they are absent.
fast = ["orjson>=3.9", "zstandard>=0.23"]
# Provider instrumentations
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
langchain = ["langchain-core>=0.2"]
llama_index = ["llama-index-core>=0.10"]
crewai = ["crewai>=0.50"]
autogen = ["pyautogen>=0.2"]
bedrock = ["boto3>=1.34"]
gemini = ["google-generativeai>=0.7"]
groq = ["groq>=0.9"]
cohere = ["cohere>=5.0"]
mistral = ["mistralai>=2.0"]
mastra = []
pydantic_ai = ["pydantic-ai>=0.1"]
otel = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]
# Convenience meta-extras
all = [
    "openai>=1.30",
    "anthropic>=0.30",
    "langchain-core>=0.2",
    "llama-index-core>=0.10",
    "crewai>=0.50",
    "pyautogen>=0.2",
    "pydantic-ai>=0.1",
    "boto3>=1.34",
    "google-generativeai>=0.7",
    "groq>=0.9",
    "cohere>=5.0",
    "mistralai>=2.0",
    # Wire-path speed (see the ``fast`` extra).
    "orjson>=3.9",
    "zstandard>=0.23",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.8",
    "respx>=0.21",
    "anyio>=4.0",
    # Exercised by tests/test_fast_json.py — the parity test only compares
    # both branches when orjson is installed, so CI (which installs ``dev``)
    # must have it or the fast path silently rots.
    "orjson>=3.9",
    # Same for the zstd wire branch (tests/test_wire_compress.py).
    "zstandard>=0.23",
]

[project.scripts]
eden-doctor = "eden_sdk.doctor:main"

[project.urls]
Homepage = "https://edenobservability.com"
Documentation = "https://docs.edenobservability.com"
Repository = "https://github.com/KaiavN/Eden"
Issues = "https://github.com/KaiavN/Eden/issues"

[tool.setuptools]
package-dir = { "" = "." }
packages = ["eden", "eden_sdk", "eden_sdk.instrumentations"]

[tool.setuptools.package-data]
eden = ["py.typed"]
eden_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
markers = [
    "perf: performance / overhead benchmarks",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

# Smoke/e2e scripts insert sys.path before importing the wheel under test.
[tool.ruff.lint.per-file-ignores]
"scripts/smoke_test.py" = ["E402"]
"scripts/e2e_instrument.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
