  const cons=[]; const mk=(d)=>{ const e=document.createElementNS('http://www.w3.org/2000/svg','path'); e.setAttribute('d',d); e.setAttribute('stroke',C.mint); e.setAttribute('stroke-width',1.2); e.setAttribute('fill','none'); e.setAttribute('opacity',.55); svg.appendChild(e); const L=e.getTotalLength(); e.style.strokeDasharray=L; e.style.strokeDashoffset=L; e._L=L; cons.push(e); };
  mk('M0 540H1920'); mk('M960 0V1080'); for(const r of [160,300,460]) mk(`M${960+r} 540A${r} ${r} 0 1 1 ${960-r} 540A${r} ${r} 0 1 1 ${960+r} 540`); mk('M560 140L1360 940'); mk('M1360 140L560 940');

  const tags={0:'acts',2:'what',3:'when'}; const sp=[...rq.children]; Object.entries(tags).forEach(([i,tx])=>sp[i].querySelector('b').textContent=tx.toUpperCase());

poster(37,40,C.indigo,C.paper,'03 — how it works',p=>{ el(p,'X','left:70px;top:110px;font-size:300px;color:transparent;-webkit-text-stroke:2px '+C.mint,'02'); const h=lines(p,'X','left:70px;top:430px;font-size:190px',['It <em>searches.</em>']);
  const rows=['Mail','Calendar','Docs','CRM','Notes'].map((n,i)=>{ const r=el(p,'',`left:1180px;top:${150+i*92}px;width:670px;height:70px`); el(r,'N','left:0;top:0;font-size:64px',n); const bar=el(r,'',`left:330px;top:30px;height:10px;width:340px;background:rgba(255,255,255,.18)`); const f=el(bar,'','left:0;top:0;height:10px;width:340px;background:'+C.mint+';transform-origin:left;transform:scaleX(0)'); return f; });
  const cnt=el(p,'M','left:76px;top:900px;color:'+C.mint,'');
  return lt=>{ up(h,lt,[0]); rows.forEach((f,i)=>f.style.transform=`scaleX(${E.io3(P(lt,B(.4+i*.3),B(1.3+i*.3)))})`); cnt.textContent=`${Math.round(1517*E.o3(P(lt,B(.4),B(2.6)))).toLocaleString('en-US')} items · ${Math.round(38*E.o3(P(lt,B(.4),B(2.6))))} ms · 0 model calls`; }; });
poster(40,43,C.paper,C.ink,'03 — how it works',p=>{ el(p,'X','left:70px;top:110px;font-size:300px;color:transparent;-webkit-text-stroke:2px '+C.ink,'03'); const h=lines(p,'X','left:70px;top:430px;font-size:190px',['It <em>finds.</em>']);

  const hl=el(p,'','left:1050px;width:860px;height:96px;background:'+C.mint); p.insertBefore(hl,rs[0]); const src=el(p,'M','left:1072px;top:466px;opacity:0','calendar · tomorrow');
  return lt=>{ up(h,lt,[0]); const k=E.o5(P(lt,B(1),B(1)+.22)); hl.style.top=(150+2*104-8)+'px'; hl.style.clipPath=`inset(0 ${(1-k)*100}% 0 0)`; src.style.opacity=P(lt,B(1.3),B(1.5)); }; });
poster(43,46,C.ink,C.paper,'03 — how it works',p=>{ const T3=[['01','Watches.',C.ink,C.paper],['02','Searches.',C.indigo,C.paper],['03','Finds.',C.mint,C.ink]];
  const cols=T3.map(([n,w,bg,fg],i)=>{ const c=el(p,'',`left:${i*640}px;top:0;width:640px;height:1080px;background:${bg};color:${fg};overflow:hidden`); el(c,'X',`left:40px;top:96px;font-size:200px;color:transparent;-webkit-text-stroke:2px ${fg}`,n); el(c,'N','left:40px;bottom:70px;font-size:100px',w); return c; });
  const band=el(p,'','left:0;top:420px;width:1920px;height:240px;background:'+C.paper+';color:'+C.ink); const bt=el(band,'X','left:0;width:1920px;text-align:center;top:46px;font-size:150px','Before it <em>acts.</em>');

  el(p,'M','left:70px;top:200px;color:'+C.grey,'without eden'); const L=lines(p,'R','left:70px;top:260px;font-size:120px;white-space:normal;width:820px;color:'+C.grey,['Done.','I cleared all','three meetings.']);
