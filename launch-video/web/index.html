<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ov"></div>
<script type="importmap">{"imports":{"three":"./lib/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from './lib/examples/jsm/postprocessing/EffectComposer.js';
import {RenderPass} from './lib/examples/jsm/postprocessing/RenderPass.js';
import {UnrealBloomPass} from './lib/examples/jsm/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from './lib/examples/jsm/postprocessing/ShaderPass.js';
import {OutputPass} from './lib/examples/jsm/postprocessing/OutputPass.js';

const W=1920,H=1080;
const E=await (await fetch('edit.json')).json();
const PB=E.P, OFF=E.OFF; const BT=j=>OFF+PB*j;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,p)=>a+(b-a)*p, P=(t,a,b)=>clamp((t-a)/(b-a));
const ease={o3:p=>1-Math.pow(1-p,3),o5:p=>1-Math.pow(1-p,5),io3:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,i3:p=>p*p*p,oExpo:p=>p>=1?1:1-Math.pow(2,-10*p),iExpo:p=>p<=0?0:Math.pow(2,10*p-10),
  oBack:p=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)}};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const MINT=new THREE.Color('#65d0a3'), TEAL=new THREE.Color('#53aeb9'), BLUE=new THREE.Color('#4694bc'), INDIGO=new THREE.Color('#4a4fd0'), RED=new THREE.Color('#ff3b3b');

await document.fonts.ready;
for(const f of ['400 20px Anton','400 20px Inter','500 20px Inter','600 20px Inter','700 20px Inter','800 20px Inter','900 20px Inter','italic 20px Serif','400 20px Mono','500 20px Mono','700 20px Mono']) await document.fonts.load(f);

/* ---------------- renderer + post ---------------- */
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setPixelRatio(1); renderer.setSize(W,H,false); renderer.setClearColor(0x000000,1);
const bgScene=new THREE.Scene(), ortho=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const footMat=new THREE.ShaderMaterial({
  uniforms:{tex:{value:null},uZoom:{value:1},uPan:{value:new THREE.Vector2()},uExpo:{value:1},uSat:{value:1},uCon:{value:1},
    uLift:{value:new THREE.Vector3()},uGain:{value:new THREE.Vector3(1,1,1)},uRGB:{value:0},uGlitch:{value:0},uTime:{value:0},uFade:{value:1},uDark:{value:0}},
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`uniform sampler2D tex; uniform float uZoom,uExpo,uSat,uCon,uRGB,uGlitch,uTime,uFade,uDark; uniform vec2 uPan; uniform vec3 uLift,uGain; varying vec2 vUv;
  float h(float n){return fract(sin(n*91.3458)*47453.5453);}
  void main(){
    vec2 uv=(vUv-.5)/uZoom+.5+uPan;
    if(uGlitch>0.){ float row=floor(uv.y*28.+floor(uTime*24.)*3.); float r=h(row); if(r<uGlitch*.6) uv.x+= (h(row+7.)-.5)*.25*uGlitch; float blk=floor(uv.y*9.)+floor(uTime*12.); if(h(blk)<uGlitch*.25) uv.y+= (h(blk+3.)-.5)*.1; }
    vec2 dir=(uv-.5); float s=uRGB+uGlitch*.02;
    vec3 c; c.r=texture2D(tex,uv+dir*s+vec2(s*.5,0.)).r; c.g=texture2D(tex,uv).g; c.b=texture2D(tex,uv-dir*s-vec2(s*.5,0.)).b;
    c=pow(max(c,0.),vec3(1./2.2));
    c*=uExpo; float l=dot(c,vec3(.2126,.7152,.0722)); c=mix(vec3(l),c,uSat); c=(c-.5)*uCon+.5;
    c=c*uGain+uLift*(1.-c);
    c=clamp(c,0.,1.); c=pow(c,vec3(2.2));
    gl_FragColor=vec4(c*uFade*(1.-uDark),1.);
  }`,depthTest:false,depthWrite:false});
const footQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),footMat); bgScene.add(footQuad);

const composer=new EffectComposer(renderer);
const bgPass=new RenderPass(bgScene,ortho); composer.addPass(bgPass);
const fgPass=new RenderPass(new THREE.Scene(),new THREE.PerspectiveCamera()); fgPass.clear=false; composer.addPass(fgPass);
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.6,.5,.8); composer.addPass(bloom);
const finalPass=new ShaderPass({uniforms:{tDiffuse:{value:null},uCA:{value:0},uGrain:{value:.06},uTime:{value:0},uVig:{value:.35},uFlash:{value:0},uFlashCol:{value:new THREE.Color(1,1,1)},uShake:{value:new THREE.Vector2()},uDark:{value:0}},
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float uCA,uGrain,uTime,uVig,uFlash,uDark; uniform vec3 uFlashCol; uniform vec2 uShake; varying vec2 vUv;
  float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
  void main(){ vec2 uv=vUv+uShake; vec2 d=uv-.5; float r=length(d);
    vec3 c; float ca=uCA*(.3+r);
    c.r=texture2D(tDiffuse,uv-d*ca).r; c.g=texture2D(tDiffuse,uv).g; c.b=texture2D(tDiffuse,uv+d*ca).b;
    c*=1.-uVig*smoothstep(.35,.95,r);
    float g=h(vUv*vec2(1920.,1080.)+fract(uTime*7.31)*vec2(91.,37.))-.5; c+=g*uGrain*(.25+.75*sqrt(max(c.g,0.)));
    c=mix(c,uFlashCol,uFlash); c*=1.-uDark;
    gl_FragColor=vec4(c,1.); }`});
composer.addPass(finalPass);
composer.addPass(new OutputPass());

const GRADES={
  night:{expo:1.05,sat:1.15,con:1.18,lift:[0,.035,.07],gain:[1.06,.98,.9],bloom:[.45,.5,.86]},
  warm:{expo:.98,sat:1.12,con:1.12,lift:[.04,.015,0],gain:[1.08,1.0,.84],bloom:[.4,.5,.9]},
  danger:{expo:1.0,sat:.3,con:1.4,lift:[.07,0,0],gain:[1.3,.72,.72],bloom:[.55,.5,.8]},
  cold:{expo:1.0,sat:.75,con:1.22,lift:[0,.035,.09],gain:[.88,1.0,1.12],bloom:[.5,.5,.84]},
  eden:{expo:.98,sat:1.25,con:1.1,lift:[0,.03,.035],gain:[.98,1.07,1.0],bloom:[.4,.5,.9]},
  hero:{expo:.8,sat:1.2,con:1.12,lift:[0,.02,.03],gain:[.98,1.05,1.0],bloom:[.35,.5,.92]},
  dusk:{expo:.82,sat:1.1,con:1.15,lift:[.03,.01,0],gain:[1.08,.98,.85],bloom:[.35,.5,.92]},
};

/* ---------------- footage texture loading ---------------- */
let curTex=null, curKey='';
async function loadFrame(shot,t){
  const sp=shot.speed||1; let idx=Math.floor((t-shot.t0)*sp*30)+1; idx=Math.max(1,Math.min(shot.nframes,idx));
  const key=shot.frames+'/'+idx; if(key===curKey) return;
  const blob=await (await fetch(`${shot.frames}/${String(idx).padStart(4,'0')}.jpg`)).blob();
  const bmp=await createImageBitmap(blob,{imageOrientation:'flipY'});
  const tx=new THREE.Texture(bmp); tx.colorSpace=THREE.SRGBColorSpace; tx.flipY=false; tx.minFilter=THREE.LinearFilter; tx.generateMipmaps=false; tx.needsUpdate=true;
  if(curTex){ curTex.dispose(); curTex.image.close&&curTex.image.close(); }
  curTex=tx; curKey=key; footMat.uniforms.tex.value=tx;
}

/* ---------------- helpers: canvas textures ---------------- */
function canvasTex(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; const tx=new THREE.CanvasTexture(c); tx.colorSpace=THREE.SRGBColorSpace; tx.anisotropy=4; return {c,ctx:c.getContext('2d'),tx}; }
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function glowSprite(){ const {c,ctx,tx}=canvasTex(128,128); const g=ctx.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.2,'rgba(255,255,255,.8)'); g.addColorStop(.5,'rgba(255,255,255,.2)'); g.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,128,128); tx.needsUpdate=true; return tx; }
const GLOW=glowSprite();
function pointsMat(size,opts={}){ return new THREE.ShaderMaterial({uniforms:{uSize:{value:size},uTex:{value:GLOW},uOp:{value:1}},vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`attribute float aSize; uniform float uSize; varying vec3 vC; void main(){ vC=color; vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=uSize*aSize*(300./-mv.z); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`uniform sampler2D uTex; uniform float uOp; varying vec3 vC; void main(){ vec4 t=texture2D(uTex,gl_PointCoord); gl_FragColor=vec4(vC*t.a*uOp,1.); }`,...opts}); }
function dust(n,spread,seed,col){ const r=rng(seed); const g=new THREE.BufferGeometry(); const p=new Float32Array(n*3),c=new Float32Array(n*3),s=new Float32Array(n);
  for(let i=0;i<n;i++){ p[i*3]=(r()-.5)*spread; p[i*3+1]=(r()-.5)*spread*.6; p[i*3+2]=(r()-.5)*spread; const k=.2+.8*r(); c[i*3]=col.r*k; c[i*3+1]=col.g*k; c[i*3+2]=col.b*k; s[i]=.3+r()*1.2; }
  g.setAttribute('position',new THREE.BufferAttribute(p,3)); g.setAttribute('color',new THREE.BufferAttribute(c,3)); g.setAttribute('aSize',new THREE.BufferAttribute(s,1));
  return new THREE.Points(g,pointsMat(.6)); }

/* ================= 3D SCENES ================= */
const SC={};
function persp(fov=40){ const c=new THREE.PerspectiveCamera(fov,W/H,.1,2000); return c; }

/* ---- CHAT ---- */
(function(){
  const sc=new THREE.Scene(), cam=persp(38); const {c,ctx,tx}=canvasTex(1600,1000);
  const panel=new THREE.Mesh(new THREE.PlaneGeometry(8,5),new THREE.MeshBasicMaterial({map:tx,transparent:true})); sc.add(panel);
  const rim=new THREE.Mesh(new THREE.PlaneGeometry(8.5,5.5),new THREE.MeshBasicMaterial({color:0x2a8f7a,transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false})); rim.position.z=-.05; sc.add(rim);
  const d=dust(1500,40,3,TEAL); sc.add(d);
  const PROMPT="Pay Dean Harlow's £3,800 invoice to the new bank details in his email.";
  const REPLY="Hold on. Dean says his inbox was hacked and to ring him on 07700 900481 before sending money. Call him first?";
  function wrap(text,maxW){ const words=text.split(' '); const lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(ctx.measureText(tst).width>maxW&&cur){lines.push(cur);cur=w;} else cur=tst;} if(cur)lines.push(cur); return lines; }
  function draw(mode,lb,t){
    ctx.clearRect(0,0,1600,1000);
    const g=ctx.createLinearGradient(0,0,0,1000); g.addColorStop(0,'rgba(16,24,28,.96)'); g.addColorStop(1,'rgba(9,13,16,.96)');
    rr(ctx,0,0,1600,1000,44); ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='rgba(120,220,190,.35)'; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle='#57d68f'; ctx.beginPath(); ctx.arc(60,62,10,0,7); ctx.fill();
    ctx.font='600 34px Inter'; ctx.fillStyle='#a9bec4'; ctx.fillText('Assistant',86,74);
    ctx.fillStyle='rgba(255,255,255,.07)'; ctx.fillRect(0,118,1600,2);
    const sendB = mode==='pay'?3.4:-1;
    // input
    rr(ctx,40,860,1520,100,26); ctx.fillStyle='#121b1f'; ctx.fill(); ctx.strokeStyle='#26363d'; ctx.lineWidth=2; ctx.stroke();
    ctx.font='500 44px Inter';
    if(mode==='pay' && lb<sendB){ const n=Math.floor(PROMPT.length*clamp(lb/3.2)); const s=PROMPT.slice(0,n); ctx.fillStyle='#eef5f7'; ctx.fillText(s,76,924); if(Math.floor(t*4)%2===0||lb<3.2){ ctx.fillRect(78+ctx.measureText(s).width,894,4,44);} }
    else { ctx.fillStyle='#55666c'; ctx.fillText('Message your assistant…',76,924); }
    // user bubble
    const pu = mode==='pay'? ease.o5(P(lb,sendB,sendB+.5)) : 1;
    if(pu>0){ ctx.font='600 50px Inter'; const lines=wrap(PROMPT,1000); const bw=1100,bh=lines.length*66+56; const by=lerp(860,160,pu);
      ctx.globalAlpha=pu; rr(ctx,1600-40-bw,by,bw,bh,30); ctx.fillStyle='#1f6e5c'; ctx.fill(); ctx.fillStyle='#f2fffa'; lines.forEach((l,i)=>ctx.fillText(l,1600-40-bw+44,by+72+i*66)); ctx.globalAlpha=1; }
    if(mode==='pay'){
      if(lb>4&&lb<5){ for(let i=0;i<3;i++){ ctx.fillStyle=`rgba(180,200,205,${.3+.7*(.5+.5*Math.sin(t*12-i))})`; ctx.beginPath(); ctx.arc(80+i*34,370,11,0,7); ctx.fill(); } }
      if(lb>=4.8){ const a=ease.o3(P(lb,4.8,5.2)); ctx.globalAlpha=a; rr(ctx,40,340,1180,76,18); ctx.fillStyle='#0d1417'; ctx.fill(); ctx.strokeStyle='#22343a'; ctx.stroke();
        ctx.font='500 34px Mono'; ctx.fillStyle='#9dbcc4'; ctx.fillText('pay_invoice( "Dean Harlow", £3,800, acct ••••6619 )',70,392); ctx.globalAlpha=1; }
      if(lb>=5.8){ const a=ease.oBack(P(lb,5.8,6.3)); ctx.save(); ctx.translate(80,500); ctx.scale(a,a); ctx.fillStyle='#1d7a4a'; ctx.beginPath(); ctx.arc(0,0,34,0,7); ctx.fill(); ctx.fillStyle='#b8ffd8'; ctx.font='800 40px Inter'; ctx.fillText('✓',-14,14); ctx.restore();
        ctx.globalAlpha=clamp(a); ctx.font='800 62px Inter'; ctx.fillStyle='#effff6'; ctx.fillText('Paid. £3,800 sent to Dean.',136,522); ctx.globalAlpha=1; }
    } else {
      // context block arrives
      const pc=ease.o5(P(lb,0,.6)); ctx.globalAlpha=pc; const cy=lerp(420,330,pc);
      rr(ctx,40,cy,1520,190,22); ctx.fillStyle='rgba(30,90,70,.35)'; ctx.fill(); ctx.setLineDash([12,10]); ctx.strokeStyle='#7ff0bb'; ctx.lineWidth=3; ctx.stroke(); ctx.setLineDash([]);
      ctx.font='700 28px Mono'; ctx.fillStyle='#9ae7ff'; ctx.fillText('<context from="eden">',70,cy+50);
      ctx.font='500 28px Mono'; ctx.fillStyle='#e9fff5'; ctx.fillText('gmail · Dean Harlow · Sat 24 Oct · "heads up"',70,cy+94);
      ctx.fillStyle='#bfe6d6'; ctx.fillText('someone got into my inbox… it isn\'t from me. Ring me first.',70,cy+134);
      ctx.fillStyle='#9ae7ff'; ctx.font='700 28px Mono'; ctx.fillText('</context>',70,cy+174); ctx.globalAlpha=1;
      if(lb>=1){ ctx.font='600 42px Inter'; const n=Math.floor(REPLY.length*clamp((lb-1)/2.4)); const lines=wrap(REPLY.slice(0,n),1380);
        rr(ctx,40,560,62,62,16); ctx.fillStyle='#ffe2a6'; ctx.fill(); ctx.fillStyle='#8a5200'; ctx.font='900 40px Inter'; ctx.fillText('!',63,605);
        ctx.font='600 42px Inter'; ctx.fillStyle='#fff7e8'; lines.forEach((l,i)=>ctx.fillText(l,124,602+i*58)); }
    }
    tx.needsUpdate=true;
  }
  SC.chat={scene:sc,cam,update(t,s){ const lb=(t-s.t0)/PB, p=P(t,s.t0,s.t1);
    draw(s.mode,lb,t);
    const pin=ease.o5(P(lb,0,1.2));
    panel.rotation.set(lerp(.35,.06,pin), lerp(-.55,-.18,pin)+.05*Math.sin(t*.4), lerp(-.05,0,pin)); rim.rotation.copy(panel.rotation);
    panel.position.set(0,lerp(-1.5,0,pin),0); rim.position.set(panel.position.x,panel.position.y,-.05);
    cam.position.set(lerp(-.4,.3,p), .15, lerp(7.8,6.7,ease.io3(p))); cam.lookAt(0,0,0);
    d.rotation.y=t*.03; rim.material.opacity=.15+.08*Math.sin(t*3);
    if(s.mode==='save'){ rim.material.color.set(0x2fd391); } else rim.material.color.set(lb>5.8?0x2fd391:0x2a6f8f);
    return {bloom:[.45,.4,.8], ca:.0012};
  }};
})();

/* ---- EMAIL (red) ---- */
(function(){
  const sc=new THREE.Scene(), cam=persp(36); const {c,ctx,tx}=canvasTex(1600,820);
  const card=new THREE.Mesh(new THREE.PlaneGeometry(8,4.1),new THREE.MeshBasicMaterial({map:tx,transparent:true})); sc.add(card);
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(10,6),new THREE.MeshBasicMaterial({map:GLOW,color:0xff2020,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false})); glow.position.z=-.3; sc.add(glow);
  const d=dust(1200,40,9,new THREE.Color('#ff5050')); sc.add(d);
  function draw(lb){
    ctx.clearRect(0,0,1600,820); rr(ctx,0,0,1600,820,40); ctx.fillStyle='rgba(22,10,11,.97)'; ctx.fill(); ctx.strokeStyle='rgba(255,70,70,.7)'; ctx.lineWidth=4; ctx.stroke();
    ctx.font='700 26px Mono'; ctx.fillStyle='#ff8a8a'; ctx.fillText('INBOX · UNREAD BY YOUR AGENT',64,80);
    ctx.font='700 38px Inter'; ctx.fillStyle='#ffdede'; ctx.fillText('Dean Harlow',64,152); ctx.font='500 32px Inter'; ctx.fillStyle='#c79c9d'; ctx.fillText('Sat 24 Oct · 09:00',1250,152);
    ctx.font='800 64px Inter'; ctx.fillStyle='#fff'; ctx.fillText('heads up',64,250);
    ctx.font='500 42px Inter'; ctx.fillStyle='#ecd9d9';

    ringP.rotation.y=lb*.2; logo.scale.setScalar(ease.oBack(P(lb,0,.8))); halo.material.opacity=.3+.1*Math.sin(t*4);
     d.rotation.y=-t*.04;

})();

/* ---- TERMINAL ---- */
(function(){
  const sc=new THREE.Scene(), cam=persp(38); const {c,ctx,tx}=canvasTex(1800,700);

  const d=dust(2000,60,99,MINT); sc.add(d);

    ctx.clearRect(0,0,1800,700); rr(ctx,0,0,1800,700,36); ctx.fillStyle='rgba(8,13,15,.96)'; ctx.fill(); ctx.strokeStyle='rgba(101,208,163,.55)'; ctx.lineWidth=4; ctx.stroke();
    ['#ff5f57','#febc2e','#28c840'].forEach((cl,i)=>{ctx.fillStyle=cl;ctx.beginPath();ctx.arc(50+i*40,48,13,0,7);ctx.fill();});
    ctx.font='500 62px Mono'; const n=Math.floor(CMD.length*clamp((lb-1)/3.4)); const typed=CMD.slice(0,n);
    ctx.fillStyle='#65d0a3'; ctx.fillText('$',60,200); ctx.fillStyle='#eafff6';
    const first=typed.slice(0,20), second=typed.slice(20,45), third=typed.slice(46); ctx.fillText(first,110,190); if(second) ctx.fillText(second,110,280); if(third) ctx.fillText(third,110,370);
    if(lb<4.6 && (Math.floor(t*4)%2===0 || (lb>1&&lb<4.4))){ const ln=third?third:second?second:first; const yy=third?370:second?280:190; ctx.fillRect(110+ctx.measureText(ln).width+6,yy-50,34,62); }
    if(lb>4.9){ ctx.globalAlpha=ease.o3(P(lb,4.9,5.3)); ctx.font='500 46px Mono'; ctx.fillStyle='#86a4ad'; ctx.fillText('eden proxy on http://127.0.0.1:8791/v1',60,490); ctx.fillStyle='#7ff0bb'; ctx.fillText('reached Eden ✓',60,570); ctx.globalAlpha=1; }
    tx.needsUpdate=true;
    const pin=ease.o5(P(lb,0,1)); term.rotation.set(lerp(.5,.12,pin),lerp(.4,-.08,pin)+.03*Math.sin(t*.7),0); term.position.y=lerp(-2,-.2,pin);
    grid.position.z=(t*6)%4; cam.position.set(lerp(.8,-.3,p),.5,lerp(8.4,7.0,ease.io3(p))); cam.lookAt(0,-.25,0);
    return {bloom:[.5,.4,.7], ca:.0015};
  }};
})();

/* ---- BLACK (dust) ---- */
(function(){ const sc=new THREE.Scene(), cam=persp(50); const d=dust(2500,40,123,new THREE.Color('#8fdcc8')); sc.add(d);
  SC.black={scene:sc,cam,update(t,s){ cam.position.set(0,0,lerp(12,9,P(t,s.t0,s.t1))); cam.lookAt(0,0,0); d.rotation.y=t*.06; return {bloom:[.6,.5,.5],ca:.001}; }}; })();

/* ---- END ---- reuse logo scene ---- */
SC.end={scene:SC.logo.sc,cam:SC.logo.cam,update(t,s){ const L=SC.logo; L.idle(t);
  L.plane.material.opacity=.97; L.pm.uniforms.uOp.value=.35; L.plane.scale.setScalar(1);
  const lt=t-s.t0; const hit=75.496;
  const pulse=Math.exp(-Math.max(0,t-hit)/.4)*(t>=hit?1:0);
  L.ring.scale.setScalar(lerp(.5,13,ease.o3(P(t,hit,hit+1.4)))); L.ring.material.opacity=t>hit&&t<hit+1.4?(1-P(t,hit,hit+1.4))*.9:0;
  const cam=L.cam; const z=lerp(13,15.5,ease.io3(P(lt,0,6))); cam.position.set(Math.sin(lt*.08)*1.2, lerp(-.4,-.8,P(lt,0,6)), z); cam.lookAt(0,-2.7,0);
  L.points.position.y=0; L.d.rotation.y=t*.05;
  return {bloom:[.7+.8*pulse,.5,.4], ca:.001+.006*pulse};
}};

/* ================= DOM TEXT ================= */
const ov=document.getElementById('ov');
E.shots.forEach((s,si)=>{
  const box=document.createElement('div'); box.className='shot'; ov.appendChild(box); s.box=box; s.els=[];
  (s.text||[]).forEach(tx=>{ const el=document.createElement('div'); el.className='tx '+tx.style;
    if(tx.style==='quote') el.innerHTML=`<span>${tx.text}</span>`; else if(tx.style==='code') el.innerHTML=`<b>$</b> ${tx.text}`; else el.textContent=tx.text;
    if(tx.red) el.style.color='#ff3b3b';
    const Y={sub:900,big:470,slam:540,quote:250,wordmark:420,tag:690,serif:430,code:470,hero:470}[tx.style]; el.dataset.y=tx.y||Y;
    box.appendChild(el);
    if(tx.style==='slam'){ // fit width (measure while visible)
      box.style.display='block'; el.style.display='inline-block'; el.style.left='auto'; el.style.right='auto';
      let fs=230; el.style.fontSize=fs+'px'; while(el.getBoundingClientRect().width>1720&&fs>80){fs-=6; el.style.fontSize=fs+'px';}
      el.style.display=''; el.style.left=''; el.style.right=''; box.style.display='none'; }
    s.els.push({el,tx}); });
  if(s.kind==='stats'){ box.innerHTML+=`<div class="stat" id="st0" style="top:300px"><div class="n">85 ms</div><div class="l">Eden's time</div></div>
    <div class="stat" id="st1" style="top:300px"><div class="n">0</div><div class="l">model calls</div></div>
    <div class="stat" id="st2" style="top:300px"><div class="n">$0</div><div class="l">spent</div></div>
    <div class="trio" id="st3"><div><div class="n">85 ms</div><div class="l">Eden's time</div></div><div><div class="n">0</div><div class="l">model calls</div></div><div><div class="n">$0</div><div class="l">spent</div></div></div>
    <div class="foot" id="st4" style="top:720px">measured with bun run demo · simulated user · no model key</div>`; }
  if(s.kind==='end'){ box.innerHTML=`<div class="endw wordmark" id="ew" style="top:560px;font-size:170px">EDEN</div><div class="endw" id="et" style="top:770px;font-family:Serif;font-style:italic;font-size:76px;color:#e9fff5">Context, before they ask.</div>
    <div class="endw" id="eu" style="top:900px;font-family:Mono;font-size:38px;color:#bff5df">github.com/Knihalani/Eden</div><div class="endw" id="es" style="top:960px;font-family:Mono;font-size:22px;letter-spacing:.2em;color:rgba(200,240,225,.7)">OPEN SOURCE · APACHE-2.0 · $0 TO START</div>`; }
});
function animText(el,tx,t,s){
  const at=s.t0+tx.at*PB; const lt=t-at; const out=tx._out||s.t1-.06; const y=+el.dataset.y;
  if(lt<0){ el.style.opacity=0; return; }
  let o=1, sc=1, ty=0, blur=0, sh='';
  const st=tx.style;
  if(st==='slam'){ const p=ease.o5(P(lt,0,.16)); sc=lerp(1.7,1,p)*(1+.03*P(t,at,s.t1)); blur=(1-p)*18; o=clamp(p*3);
    const k=Math.exp(-lt/.12)*14; sh=`${k}px 0 0 rgba(255,40,60,.85), ${-k}px 0 0 rgba(40,220,255,.75)`; }
  else if(st==='serif'||st==='hero'||st==='big'||st==='wordmark'){ const p=ease.o5(P(lt,0,.45)); o=p; ty=(1-p)*40; blur=(1-p)*14; sc=st==='hero'?lerp(1.08,1,p)*(1+.02*P(t,at,s.t1)):1;
    if(st==='wordmark'){ el.style.letterSpacing=lerp(.8,.32,ease.o5(P(lt,0,.8)))+'em'; } }
  else { const p=ease.o5(P(lt,0,.35)); o=p; ty=(1-p)*28; blur=(1-p)*8; }
  const po=P(t,out-.12,out); o*=1-po;
  el.style.opacity=o; el.style.top=(y-el.offsetHeight/2)+'px'; el.style.transform=`translateY(${ty}px) scale(${sc})`; el.style.filter=blur>.2?`blur(${blur}px)`:'none'; if(sh&&lt<.6) el.style.textShadow=sh+', 0 0 40px rgba(0,0,0,.75)'; else el.style.textShadow='';
}

E.shots.forEach(s=>{ const L=s.els||[]; L.forEach(({el,tx},i)=>{ for(let j=i+1;j<L.length;j++){ if(Math.abs(+L[j].el.dataset.y-(+el.dataset.y))<160){ tx._out=s.t0+L[j].tx.at*PB; break; } } }); });
/* ================= FRAME ================= */
const IMPACTS=[29.051,44.533,75.496]; const SLAMS=[];
E.shots.forEach(s=>(s.text||[]).forEach(tx=>{ if(tx.style==='slam') SLAMS.push(s.t0+tx.at*PB); }));
let lastShot=-1;
window.renderFrame=async function(t){
  const si=E.shots.findIndex(s=>t>=s.t0&&t<s.t1); const s=E.shots[si<0?E.shots.length-1:si];
  E.shots.forEach(x=>x.box.style.display=(x===s)?'block':'none');
  for(const k in SC){ if(SC[k].hud) SC[k].hud.style.display='none'; }
  let fx={bloom:[.5,.5,.8],ca:0,glitch:0,shakeBase:0};
  // background
  if(s.clip){ await loadFrame(s,t); const G=GRADES[s.grade];
    const lt=t-s.t0, p=P(t,s.t0,s.t1);
    const punch=.07*Math.exp(-lt/.14);
    footMat.uniforms.uZoom.value=lerp(s.zoom[0],s.zoom[1],ease.io3(p))*(1+punch);
    footMat.uniforms.uPan.value.set(Math.sin(t*.9)*.004,Math.cos(t*.7)*.003);
    footMat.uniforms.uExpo.value=G.expo; footMat.uniforms.uSat.value=G.sat; footMat.uniforms.uCon.value=G.con; footMat.uniforms.uLift.value.set(...G.lift); footMat.uniforms.uGain.value.set(...G.gain);
    let gl=0; if(s.glitchIn) gl=Math.max(gl,1-P(lt,0,.5)); if(s.glitchEnd) gl=Math.max(gl,P(t,s.t1-.5,s.t1)); if(s.strobe) gl=.35;
    footMat.uniforms.uGlitch.value=gl; footMat.uniforms.uRGB.value=.012*Math.exp(-lt/.1)+(s.strobe?.01:0);
    footMat.uniforms.uTime.value=t; footMat.uniforms.uFade.value=s.fadein?ease.o3(P(t,0,.6)):1;
    footMat.uniforms.uDark.value=s.kind==='stats'?.55:0;
    fx.bloom=G.bloom; fx.ca=.0015; fx.glitch=gl;
    bgPass.enabled=true;
  } else { footMat.uniforms.uFade.value=0; bgPass.enabled=true; }
  // foreground 3D
  let sc3=null;
  if(s.kind!=='footage' && s.kind!=='stats'){ const S3=SC[s.kind]; const r=S3.update(t,s); fx={...fx,...r}; fgPass.scene=S3.scene; fgPass.camera=S3.cam; fgPass.enabled=true; if(S3.hud && s.kind==='storm') S3.hud.style.display=s.fast?'none':'block'; }
  else { fgPass.enabled=false; }
  // text
  (s.els||[]).forEach(({el,tx})=>animText(el,tx,t,s));
  if(s.kind==='stats'){ const lb=(t-s.t0)/PB; ['st0','st1','st2'].forEach((id,i)=>{ const el=document.getElementById(id); const lt=lb-i; const on=lt>=0&&lt<1; el.style.display=on?'block':'none'; if(on){ const p=ease.o5(P(lt,0,.3)); el.style.opacity=clamp(p*3); el.style.transform=`scale(${lerp(1.6,1,p)})`; el.style.filter=p<.98?`blur(${(1-p)*14}px)`:'none'; } });
    const t3=document.getElementById('st3'), t4=document.getElementById('st4'); const p3=ease.o5(P(lb,3,3.3)); t3.style.display=lb>=3?'flex':'none'; t3.style.opacity=p3; t3.style.transform=`scale(${lerp(1.2,1,p3)})`; t4.style.display=lb>=3?'block':'none'; t4.style.opacity=ease.o3(P(lb,3.2,3.6)); }
  if(s.kind==='end'){ const lt=t-s.t0; [['ew',.2],['et',.9],['eu',1.6],['es',2.0]].forEach(([id,a],i)=>{ const el=document.getElementById(id); const p=ease.o5(P(lt,a,a+.8)); el.style.opacity=p; el.style.transform=`translateY(${(1-p)*30}px)`; el.style.filter=p<.98?`blur(${(1-p)*12}px)`:'none'; if(id==='ew') el.style.letterSpacing=lerp(.9,.32,p)+'em'; }); }
  // post
  bloom.strength=fx.bloom[0]; bloom.radius=fx.bloom[1]; bloom.threshold=fx.bloom[2];
  // shake
  let sh=fx.shakeBase||0; IMPACTS.forEach(ti=>{ if(t>=ti) sh+=.012*Math.exp(-(t-ti)/.18); }); SLAMS.forEach(ti=>{ if(t>=ti) sh+=.006*Math.exp(-(t-ti)/.12); });
  const k=Math.floor(t*30); const sx=(hash(k)-.5)*2*sh, sy=(hash(k+77)-.5)*2*sh;
  finalPass.uniforms.uShake.value.set(sx,sy); ov.style.transform=`translate(${-sx*W}px,${sy*H}px)`;
  // cut-based chromatic burst
  const cutAge=t-s.t0; finalPass.uniforms.uCA.value=fx.ca+.01*Math.exp(-cutAge/.08)+(fx.glitch||0)*.01;
  finalPass.uniforms.uTime.value=t; finalPass.uniforms.uGrain.value=.045; finalPass.uniforms.uVig.value=.42;
  // flashes
  let fl=0; IMPACTS.forEach(ti=>{ if(t>=ti) fl=Math.max(fl,.9*Math.exp(-(t-ti)/.12)); });
  if(s.flashIn) fl=Math.max(fl,.6*Math.exp(-cutAge/.08));
  // pre-drop suck to white
  fl=Math.max(fl, ease.iExpo(P(t,28.65,29.05))*.85*(t<29.051?1:0));
  finalPass.uniforms.uFlash.value=fl;
  // global fades
  let dark=0; if(t>=E.END-1.2) dark=ease.i3(P(t,E.END-1.2,E.END-.05));
  finalPass.uniforms.uDark.value=dark; ov.style.opacity=1-dark;
  composer.render();
};
