services:
  postgres:
    image: postgres:16-alpine
    container_name: eden_postgres
    environment:
      POSTGRES_DB: eden
      POSTGRES_USER: eden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eden_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eden -d eden"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: eden_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: eden_pgbouncer
    environment:
      DATABASE_URL: "postgres://eden:eden_dev_password@postgres:5432/eden"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # Redis — required by TenantRateLimitMiddleware (sliding-window rate
  # limiter), IdempotencyMiddleware, OptimizationCache, and the
  # RedisTailer judge pipeline. Falls back to in-memory if absent, but
  # only the in-memory path is single-process; production needs Redis.
  redis:
    image: redis:7-alpine
    container_name: eden_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse — backs the columnar query engine (Cat 18) and the
  # ClickHouseSink for high-cardinality telemetry rollups. Eden talks
  # to it over the HTTP interface (port 8123) using raw aiohttp;
  # see docs/architecture/clickhouse-transport.md for rationale.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: eden_clickhouse
    environment:
      CLICKHOUSE_DB: eden
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP interface (used by ClickHouseSink)
      - "9000:9000"  # native TCP (unused by Eden today, available for clients)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Typesense — backs the full-text search layer (Phase B). Indexes
  # span input/output text + tool names so users can grep across
  # all traces (Laminar parity for the "fast text search" surface).
  # Single-binary, <50MB RAM at default scale.
  #
  # SECURITY: TYPESENSE_API_KEY MUST be set in .env. There is no
  # fallback default — the service refuses to boot without one
  # (see the `command` below which calls `--api-key=${...:?...}`).
  # Generate one with `openssl rand -hex 32`. The same value must
  # be set in eden_api via TYPESENSE_API_KEY so the collector can
  # talk to it.
  typesense:
    image: typesense/typesense:27.1
    container_name: eden_typesense
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY must be set in .env (use: openssl rand -hex 32)}
      TYPESENSE_ENABLE_API_ADMIN: 1
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    command:
      - --data-dir=/data
      - --api-key=${TYPESENSE_API_KEY:?TYPESENSE_API_KEY must be set in .env (use: openssl rand -hex 32)}
      - --enable-cors
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8108/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: FalkorDB for knowledge graph (uncomment if needed)
  # falkordb:
  #   image: falkordb/falkordb:latest
  #   container_name: eden_falkordb
  #   ports:
  #     - "6379:6379"
  #     - "3000:3000"
  #   volumes:
  #     - falkordb_data:/data

  # Optional: vLLM for self-hosted inference (uncomment if needed)
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   container_name: eden_vllm
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - MODEL_NAME=Qwen/Qwen2.5-Coder-7B-Instruct
  #     - QUANTIZATION=awq
  #     - GPU_MEMORY_UTILIZATION=0.9
  #   volumes:
  #     - vllm_model:/root/.cache/vllm
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   runtime: nvidia

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  clickhouse_data:
  typesense_data:
  # falkordb_data:
  # vllm_model: