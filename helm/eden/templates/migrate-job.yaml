apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "eden.fullname" . }}-migrate
  labels:
    {{- include "eden.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "eden.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ include "eden.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - from eden.db_migrations.runner import run_alembic_upgrade_head; run_alembic_upgrade_head()
          env:
            - name: EDEN_DB_URL
              value: {{ include "eden.postgresUrl" . }}
            - name: SKIP_MIGRATIONS
              value: "0"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
