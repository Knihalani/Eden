apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eden.fullname" . }}-api
  labels:
    {{- include "eden.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "eden.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "eden.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ include "eden.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: EDEN_DB_URL
              value: {{ include "eden.postgresUrl" . }}
            - name: EDEN_REDIS_URL
              value: {{ include "eden.redisUrl" . }}
            - name: EDEN_QDRANT_URL
              value: {{ include "eden.qdrantUrl" . }}
            {{- if .Values.externalTypesense.host }}
            - name: TYPESENSE_ENABLED
              value: "true"
            - name: TYPESENSE_HOST
              value: {{ .Values.externalTypesense.host | quote }}
            - name: TYPESENSE_PORT
              value: {{ .Values.externalTypesense.port | default "8108" | quote }}
            - name: TYPESENSE_PROTOCOL
              value: {{ .Values.externalTypesense.protocol | default "http" | quote }}
            {{- if and .Values.secrets.create .Values.secrets.typesenseApiKey }}
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "eden.fullname" . }}-secrets
                  key: typesense-api-key
            {{- end }}
            {{- end }}
            {{- if .Values.externalClickhouse }}
            - name: CLICKHOUSE_URL
              value: {{ .Values.externalClickhouse | quote }}
            {{- end }}
            - name: SKIP_MIGRATIONS
              value: "1"
            - name: EDEN_RUN_BACKGROUND_WORKERS
              value: "0"
            - name: EDEN_PRODUCTION
              value: "true"
            - name: EDEN_SSO_OIDC_ISSUER
              value: {{ .Values.sso.oidcIssuer | quote }}
            - name: EDEN_SSO_SAML_METADATA_URL
              value: {{ .Values.sso.samlMetadataUrl | quote }}
            - name: EDEN_DISCORD_WEBHOOK_SECRET
              {{- if .Values.discord.webhookUrlSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discord.webhookUrlSecret }}
                  key: url
              {{- else }}
              value: ""
              {{- end }}
            - name: EDEN_SUPPORT_WEBHOOK_URL
              value: {{ .Values.support.webhookUrl | quote }}
            - name: EDEN_PROMETHEUS_REMOTE_WRITE_URL
              value: {{ .Values.monitoring.prometheus.remoteWriteUrl | quote }}
          livenessProbe:
            httpGet: { path: /live, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
