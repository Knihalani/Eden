{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eden.fullname" . }}-secrets
  labels:
    {{- include "eden.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.postgresPassword }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.typesenseApiKey }}
  typesense-api-key: {{ .Values.secrets.typesenseApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.clickhousePassword }}
  clickhouse-password: {{ .Values.secrets.clickhousePassword | quote }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}
{{- end }}
