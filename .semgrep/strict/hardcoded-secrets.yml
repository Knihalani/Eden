rules:
  - id: hardcoded-jwt-secret
    languages: [python]
    message: |
      Detected hardcoded JWT secret. Use environment variables instead.
    severity: ERROR
    pattern-regex: '(?i)(jwt_secret|secret_key)\s*=\s*["\'][^"\']+["\']'
    paths:
      include:
        - src/eden/**/*.py
      exclude:
        - src/eden/config.py
        - src/eden/api/routes/auth.py

  - id: hardcoded-api-key
    languages: [python]
    message: |
      Detected potential hardcoded API key. Use environment variables or secrets manager.
    severity: WARNING
    pattern-regex: '(?i)(api_key|apikey|api_secret)\s*=\s*["\'][^"\']{16,}["\']'
    paths:
      include:
        - src/eden/**/*.py
      exclude:
        - src/eden/config.py
        - tests/**/*.py
